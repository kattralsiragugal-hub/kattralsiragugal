/* ONE-TIME CLEANUP (Admin): deletes every uploaded file / folder record inside AUDIO BOOK and THB (all STD, terms, subjects, mediums),
   removes THB from saved folder lists and puts a fresh, empty AUDIO BOOK into every saved list. Marker: db.folders['__abfix'] (syncs to Drive). */
function purgeAB(){
 if(!(REMOTE&&me&&me.admin&&lastPull>0)||db.folders['__abfix'])return;
 const BAD=['AUDIO BOOK','THB'],hit=k=>{const p=String(k).split('/');return p[0]==='video'&&p.length>=6&&BAD.includes(p[5])};
 Object.keys(db.items).forEach(k=>{if(!hit(k))return;
  (db.items[k]||[]).forEach(it=>{if(!it)return;if(it.f)fdel(it.f);if(it.d)api('del',{name:me.name,role:me.role,pw:me.pw,id:it.d}).catch(()=>{})});
  delete db.items[k]});
 Object.keys(db.folders).forEach(k=>{
  if(hit(k)){delete db.folders[k];return}
  const p=k.split('/'),a=db.folders[k];
  if(p[0]==='video'&&p.length===5&&Array.isArray(a)&&(a.includes('TEXT BOOK')||a.includes('VIDEOS'))){
   const b=a.filter(x=>x!=='THB');if(!b.includes('AUDIO BOOK')){const i=b.indexOf('TEXT BOOK');b.splice(i>=0?i+1:b.length,0,'AUDIO BOOK')}db.folders[k]=b}});
 ['__hide','__stuhide'].forEach(h=>{if(Array.isArray(db.folders[h]))db.folders[h]=db.folders[h].filter(x=>!hit(x))});
 db.folders['__abfix']=['1'];save();
}

/* ---------- WEBSITE VISITOR COUNTER (everyone sees it on the Home page) + TEACHER LOGIN COUNTER (Admin only) ----------
   Needs the small Apps Script "Counter_Code.gs": Deploy > New deployment > Web app (Execute as: Me, Who has access: Anyone)
   and paste its Web App URL between the quotes below. Empty = counters are off (Admin sees a reminder). */
const CNT_API='https://script.google.com/macros/s/AKfycbx-aKE_RLBpCUshp2Mq9VSyJOxqmredHuU68wXmM2N2GsnEYatBOj9n05RttcjZS2B6Tw/exec';
let CNT={v:+store.get('ks_cnt_v')||0,t:+store.get('ks_cnt_t')||0,tl:+store.get('ks_cnt_tl')||0},cntLast=0;
const cntFmt=n=>Number(n||0).toLocaleString('en-IN');
async function cntCall(q){
 if(!CNT_API)return null;
 const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);
 try{const r=await fetch(CNT_API+(CNT_API.indexOf('?')<0?'?':'&')+q+'&_='+Date.now(),{signal:ac.signal,redirect:'follow',cache:'no-store'});
  const j=JSON.parse(await r.text());return j&&j.ok?j:null}
 catch(e){return null}finally{clearTimeout(to)}
}
function cntApply(j){
 if(!j)return;cntLast=Date.now();
 if(typeof j.visits==='number'){CNT.v=j.visits;store.set('ks_cnt_v',String(CNT.v))}
 if(typeof j.teachers==='number'){CNT.t=j.teachers;store.set('ks_cnt_t',String(CNT.t))}
 if(typeof j.logins==='number'){CNT.tl=j.logins;store.set('ks_cnt_tl',String(CNT.tl))}
 const set=(c,v)=>document.querySelectorAll(c).forEach(e=>{e.textContent=cntFmt(v)});
 set('.cnt-v',CNT.v);set('.cnt-t',CNT.t);set('.cnt-tl',CNT.tl);
}
/* one visit = one browser session (a refresh does not add another visit) */
async function cntInit(){
 if(!CNT_API)return;
 let first=true;try{first=!sessionStorage.getItem('ks_cnt_s')}catch(e){}
 const j=await cntCall(first?'a=visit':'a=stats');
 if(!j)return;
 if(first){try{sessionStorage.setItem('ks_cnt_s','1')}catch(e){}}
 cntApply(j);
}
function cntRefresh(){if(CNT_API&&Date.now()-cntLast>60000){cntLast=Date.now();cntCall('a=stats').then(cntApply)}}
/* a Teacher (not the Admin) has just logged in: the server counts each teacher once + every login */
function cntLogin(){
 try{if(!CNT_API||!me||me.admin||me.role!=='TEACHER')return;
  cntCall('a=tlogin&n='+encodeURIComponent(String(me.name).trim().toLowerCase())).then(cntApply)}catch(e){}
}
function visBar(){
 let h='';

 if(isAdmin())h+=CNT_API?`<span class="cnt-pill adm">👩‍🏫 Teacher Login: <b class="cnt-t">${cntFmt(CNT.t)}</b> பேர் · மொத்த Login: <b class="cnt-tl">${cntFmt(CNT.tl)}</b> <small>(Admin மட்டும்)</small></span>`:`<span class="cnt-pill adm">⚙ Counter_Code.gs Web App URL-ஐ CNT_API-இல் சேர்க்கவும் <small>(Admin மட்டும்)</small></span>`;

}

const STORY=[["தாகமுள்ள காகம்","கோடைக் காலத்தில் தாகத்தால் தவித்த காகம் ஒரு பானையில் சிறிது நீர் இருப்பதைக் கண்டது. அதன் அலகு நீரை எட்டவில்லை. காகம் யோசித்து, சிறு கூழாங்கற்களைப் பானையில் போட்டது. நீர் மேலே வர, காகம் தாகம் தீர்த்தது.","முயன்றால் முடியாதது இல்லை; சிந்தித்துச் செயல்பட்டால் வெற்றி கிடைக்கும்."],["முயலும் ஆமையும்","தான் வேகமாக ஓடக்கூடியவன் என்ற செருக்கில் முயல் ஆமையுடன் ஓட்டப் பந்தயம் வைத்தது. பாதி வழியில் முயல் தூங்கிவிட்டது. ஆமை விடாமல் மெதுவாக நடந்து முதலில் இலக்கை அடைந்தது.","விடாமுயற்சி வெற்றி தரும்; அலட்சியம் தோல்வி தரும்."],["சிங்கமும் எலியும்","தூங்கிக்கொண்டிருந்த சிங்கத்தின் மேல் எலி ஓடியது. கோபமடைந்த சிங்கம் எலியைப் பிடித்தது; எலி கெஞ்சவே விட்டுவிட்டது. பின்னொரு நாள் சிங்கம் வலையில் சிக்கியபோது, அந்த எலி வலையைக் கடித்துச் சிங்கத்தைக் காப்பாற்றியது.","சிறியவர் என்று யாரையும் குறைவாக எண்ணக் கூடாது; இரக்கம் காட்டினால் உதவி திரும்பி வரும்."],["நரியும் திராட்சையும்","பசித்த நரி உயரமான கொடியில் தொங்கிய திராட்சைக் கொத்தைக் கண்டது. எவ்வளவு எம்பியும் எட்டவில்லை. கடைசியில், அந்தப் பழங்கள் புளிப்பு என்று சொல்லிவிட்டுச் சென்றது.","நம்மால் முடியாததை நினைத்துப் பிறரையோ பொருளையோ குறை சொல்லக் கூடாது."],["ஒற்றுமையே பலம்","ஒரு விவசாயி தன் பிள்ளைகளுக்குக் குச்சிக் கட்டைக் கொடுத்து முறிக்கச் சொன்னார்; யாராலும் முடியவில்லை. கட்டை அவிழ்த்துத் தனித்தனிக் குச்சிகளைக் கொடுத்ததும் எளிதில் முறித்தனர்.","ஒற்றுமையாக இருந்தால் எந்தத் துன்பத்தையும் வெல்லலாம்."],["பொன் முட்டையிடும் வாத்து","ஒருவனிடம் தினமும் ஒரு பொன் முட்டையிடும் வாத்து இருந்தது. எல்லா முட்டைகளையும் ஒரே நாளில் பெற நினைத்து வாத்தை அறுத்தான். உள்ளே ஒன்றுமில்லை; வாத்தையும் இழந்தான்.","பேராசை பெருநஷ்டம்."],["ஓநாய் வருது","ஆடு மேய்க்கும் சிறுவன் விளையாட்டாக ஓநாய் வருது என்று கத்தி ஊரைக் கூட்டினான். பலமுறை பொய் சொன்னான். உண்மையிலேயே ஓநாய் வந்தபோது யாரும் நம்பி வரவில்லை; ஆடுகளை இழந்தான்.","பொய் சொல்பவரை யாரும் நம்ப மாட்டார்கள்; எப்போதும் உண்மையே பேச வேண்டும்."],["நாயும் நிழலும்","வாயில் எலும்புத் துண்டுடன் பாலத்தில் சென்ற நாய், ஆற்று நீரில் தன் நிழலைக் கண்டு அது இன்னொரு நாய் என்று நினைத்தது. அதன் எலும்பையும் பெற குரைத்தபோது தன் எலும்பு நீரில் விழுந்தது.","இருப்பதில் மனநிறைவு கொள்ள வேண்டும்; பேராசை இருப்பதையும் இழக்கச் செய்யும்."],["எறும்பும் புறாவும்","நீரில் தத்தளித்த எறும்புக்கு ஒரு புறா இலையைப் போட்டுக் காப்பாற்றியது. பிறகு புறாவை வேடன் குறிவைத்தபோது, எறும்பு வேடனின் காலைக் கடித்தது; குறி தவறிப் புறா தப்பியது.","உதவி செய்தால் உதவி கிடைக்கும்; நன்றி மறக்கக் கூடாது."],["நேர்மையான விறகுவெட்டி","ஆற்றில் கோடரி விழுந்ததும் விறகுவெட்டி வருந்தினான். தெய்வம் பொன், வெள்ளிக் கோடரிகளைக் காட்டியது; அவன் தன்னுடையது இரும்புக் கோடரி என்றே சொன்னான். அவன் நேர்மையைப் பாராட்டி மூன்றையும் பரிசாகத் தந்தது.","நேர்மை எப்போதும் நன்மை தரும்."],["குரங்கும் முதலையும்","ஆற்றங்கரை நாவல் மரத்தில் வாழ்ந்த குரங்கு, முதலை நண்பனுக்குப் பழங்களைத் தந்து வந்தது. முதலை தன் மனைவிக்காகக் குரங்கின் இதயத்தைக் கேட்டபோது, குரங்கு இதயத்தை மரத்தில் வைத்துவிட்டதாகச் சொல்லித் தப்பித்தது.","ஆபத்தில் பதற்றப்படாமல் சமயோசிதமாகச் சிந்திக்க வேண்டும்; நண்பனை ஏமாற்றுவது தவறு."],["புண்ணியகோடி என்ற பசு","கன்றுக்குப் பால் கொடுத்துவிட்டுத் திரும்பி வருவேன் என்று புண்ணியகோடி என்ற பசு புலியிடம் வாக்குறுதி அளித்தது. சொன்னபடியே திரும்பி வந்தது. அதன் உண்மையைக் கண்ட புலி மனம் மாறி, பசுவை விட்டுவிட்டது.","கொடுத்த வாக்கைக் காப்பாற்ற வேண்டும்; உண்மைக்கு எல்லோரும் தலைவணங்குவர்."],["அவ்வையும் நாவல் பழமும்","மரத்தில் இருந்த சிறுவன் அவ்வையாரிடம் சுட்ட பழம் வேண்டுமா, சுடாத பழம் வேண்டுமா என்று கேட்டான். புரியாமல் விழித்த அவ்வையார், அவன் உதிர்த்த பழத்தில் ஒட்டிய மண்ணை ஊதியபோது, அவன் சிரித்தான். தான் அறிந்தது சிறிது என்று அவ்வையார் உணர்ந்தார்.","கற்றது கைம்மண் அளவு; அகந்தை வேண்டாம், கற்றுக்கொள்ள எப்போதும் தயாராக இருக்க வேண்டும்."],["மூன்று மீன்கள்","ஒரு குளத்தில் மூன்று மீன்கள் இருந்தன. வலை வீச வருவதை அறிந்த முதல் மீன் உடனே வேறு இடம் சென்றது; இரண்டாவது இறந்தது போல நடித்துத் தப்பியது; மூன்றாவது அலட்சியமாக இருந்து வலையில் சிக்கியது.","வரும் ஆபத்தை முன்கூட்டியே உணர்ந்து நடந்தால் தப்பலாம்."],["உப்பு மூட்டைக் கழுதை","உப்பு மூட்டையைச் சுமந்த கழுதை ஆற்றில் வழுக்கி விழுந்தபோது உப்பு கரைந்து சுமை குறைந்தது. அது தினமும் விழ ஆரம்பித்தது. வணிகன் அடுத்த நாள் பஞ் const TAMON=['ஜனவரி','பிப்ரவரி','மார்ச்','ஏப்ரல்','மே','ஜூன்','ஜூலை','ஆகஸ்ட்','செப்டம்பர்','அக்டோபர்','நவம்பர்','டிசம்பர்'];
function histToday(){
 const d=new Date(),k=x=>String(x).padStart(2,'0'),key=k(d.getMonth()+1)+'-'+k(d.getDate());
 const doy=s=>{const m=+s.slice(0,2),dd=+s.slice(3);return new Date(2024,m-1,dd)/864e5};
 if(HIST[key])return {key,exact:true,e:HIST[key]};
 const t=doy(key);let best=null,bd=1e9;
 Object.keys(HIST).forEach(s=>{let x=Math.abs(doy(s)-t);x=Math.min(x,366-x);if(x<bd){bd=x;best=s}});
 return {key:best,exact:false,e:HIST[best]};
}
const hLbl=key=>(+key.slice(3))+' '+TAMON[+key.slice(0,2)-1];
const sayG=el=>{const g=GK[dayN%GK.length];sayText(el,g[0]+' விடை. '+g[1])};
let STORY_LIVE=null;
const spk=t=>{if(t.length<=900)return t;const c=t.slice(0,900),i=Math.max(c.lastIndexOf('.'),c.lastIndexOf('?'),c.lastIndexOf('!'));return i>200?c.slice(0,i+1):c};
const storyHTML=s=>`<div class="stt">${esc(s.t)}</div>${esc(s.b).split(/\n+/).map(x=>'<p>'+x+'</p>').join('')}${s.m?`<p class="mor"><b>நீதி:</b> ${esc(s.m)}</p>`:''}<p class="src">${s.src==='ws'?'📖 மூலம்: விக்கிமூலம் – மாணவர் மாணவியருக்கு நீதிக் கதைகள் (முல்லை முத்தையா)':'📖 உள்ளிணைந்த கதை (இணையம் கிடைத்ததும் விக்கிமூலக் கதை தானாக வரும்)'}</p>`;
const storyCur=()=>STORY_LIVE||(x=>({t:x[0],b:x[1],m:x[2]}))(STORY[dayN%STORY.length]);
const sayS=el=>{const s=storyCur();sayText(el,spk(s.t+'. '+s.b+(s.m?' நீதி. '+s.m:'')))};
function setStory(s){STORY_LIVE=s;const b=document.getElementById('storyBox');if(b)b.innerHTML=storyHTML(s)}
const WS_API='https://ta.wikisource.org/w/api.php',WS_BOOK='மாணவர் மாணவியருக்கு நீதிக் கதைகள்';
async function wsJson(q){const u=WS_API+'?'+new URLSearchParams(Object.assign({format:'json',origin:'*'},q));const ac=new AbortController(),to=setTimeout(()=>ac.abort(),9000);try{const r=await fetch(u,{signal:ac.signal});return await r.json()}finally{clearTimeout(to)}}
function wsText(html){const d=new DOMParser().parseFromString(html,'text/html');
 d.querySelectorAll('style,script,table,sup,.mw-editsection,.noprint,.pagenum,.ws-pagenum,.mw-empty-elt,.reference').forEach(x=>x.remove());
 return [...d.querySelectorAll('p')].map(p=>p.textContent.replace(/\s+/g,' ').trim()).filter(x=>x.length>1).join('\n')}
/* இணையத்திலிருந்து (விக்கிமூலம்) இன்றைய நீதிக்கதை: நூலின் கதைகளில் நாளுக்கு ஒன்று; ஒரு நாளுக்கு ஒருமுறை பெற்றுச் சேமிக்கும் */
async function storyLive(){
 const day=todayStr();
 try{const c=JSON.parse(store.get('ks_story')||'null');if(c&&c.day===day&&c.s){setStory(c.s);return}}catch(e){}
 try{
  const L=await wsJson({action:'query',list:'allpages',apprefix:WS_BOOK+'/',aplimit:'200'});
  const pg=((L.query||{}).allpages||[]).map(x=>x.title).filter(t=>!/முன்னுரை|பொருளடக்கம்|பதிப்புரை|அணிந்துரை|என்னுரை|உள்ளடக்கம்/.test(t));
  if(!pg.length)return;
  for(let t=0;t<6;t++){
   const title=pg[(dayN+t)%pg.length];
   const P=await wsJson({action:'parse',page:title,prop:'text',formatversion:'2',redirects:'1'});
   const txt=wsText((P.parse||{}).text||'');
   if(txt.length>=120){const s={t:title.slice(WS_BOOK.length+1),b:txt,m:'',src:'ws'};store.set('ks_story',JSON.stringify({day,s}));setStory(s);return}
  }
 }catch(e){/* இணையம் இல்லையெனில் உள்ளிணைந்த கதை தொடரும் */}
}
const sayH=el=>{const v=VT_LIVE&&VT_LIVE.day===todayStr()?VT_LIVE:null;
 if(v){sayText(el,spk(vtLbl()+'. '+v.ev.map(e=>e.t+(e.y?'. '+e.y+' ஆம் ஆண்டு':'')).join('. ')+'. '+v.notes.map(n=>n.h+'. '+n.p).join('. ')));return}
 const h=histToday();sayText(el,hLbl(h.key)+'. '+h.e[0]+' ஆம் ஆண்டு. '+h.e[1])};
function sayEn(el,text){
 if(!window.speechSynthesis){alert('இந்த Browser-இல் வாசிக்கும் வசதி இல்லை.');return}
 const same=sayEl===el;sayStop();if(same)return;
 const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=.85;
 const t=(speechSynthesis.getVoices()||[]).find(x=>/^en/i.test(x.lang));if(t)u.voice=t;
 const done=()=>{if(sayEl===el){el.classList.remove('speaking');sayEl=null}};
 u.onend=done;u.onerror=done;sayEl=el;el.classList.add('speaking');speechSynthesis.speak(u)}
/* Word of the day: speaks the English word (English voice) and then its Tamil meaning (Tamil voice) */
const sayW=el=>{const w=WORDS[dayN%WORDS.length];
 if(!window.speechSynthesis){alert('Browser does not support voice.');return}
 const same=sayEl===el;sayStop();if(same)return;
 const vs=speechSynthesis.getVoices()||[],done=()=>{if(sayEl===el){el.classList.remove('speaking');sayEl=null}};
 const a=new SpeechSynthesisUtterance(w[0]);a.lang='en-IN';a.rate=.85;const ev=vs.find(x=>/^en/i.test(x.lang));if(ev)a.voice=ev;
 const mean=String(w[1]||'').split('/').map(x=>x.trim()).filter(Boolean).join(', ');
 a.onerror=done;
 if(mean){const b=new SpeechSynthesisUtterance(mean);b.lang='ta-IN';b.rate=.85;const tv=vs.find(x=>/^ta/i.test(x.lang));if(tv)b.voice=tv;b.onend=done;b.onerror=done;a.onend=()=>{if(sayEl===el){try{speechSynthesis.speak(b)}catch(e){done()}}}}
 else a.onend=done;
 sayEl=el;el.classList.add('speaking');speechSynthesis.speak(a)};
/* இணையத்திலிருந்து (Wikipedia) இன்றைய நாளின் வரலாற்று நிகழ்வுகள்; ஒரு நாளுக்கு ஒருமுறை மட்டும் பெற்றுச் சேமிக்கும் */
async function histLive(){
 const d=new Date(),k=x=>String(x).padStart(2,'0'),mm=k(d.getMonth()+1),dd=k(d.getDate()),day=todayStr();
 const paint=a=>{const b=document.getElementById('histLive');if(b&&a.length)b.innerHTML='<div class="hl"><b>🌐 Wikipedia (English)</b>'+a.map(x=>`<div>• <b>${esc(String(x.y))}</b> – ${esc(x.t)}</div>`).join('')+'</div>'};
 try{const c=JSON.parse(store.get('ks_hist')||'null');if(c&&c.day===day&&c.items&&c.items.length){paint(c.items);return}}catch(e){}
 try{
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
  const r=await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`,{signal:ac.signal});clearTimeout(to);
  const j=await r.json();
  const ev=(j.events||[]).filter(e=>e&&e.year>=1500&&e.text&&e.text.length<200).sort((a,b)=>b.year-a.year);
  const items=[],step=Math.max(1,Math.floor(ev.length/3));
  for(let i=0;i<ev.length&&items.length<3;i+=step)items.push({y:ev[i].year,t:ev[i].text});
  if(items.length){store.set('ks_hist',JSON.stringify({day,items}));paint(items)}
 }catch(e){/* இணையம் இல்லையெனில் உள்ளிணைந்த பதிவு மட்டும் தெரியும் */}

 im.onload=()=>{const M=640,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u});

/* AUTO IMAGE: picks a picture for the news text from Wikipedia pages, then Wikimedia Commons (Tamil, then English words). Runs when a notification is saved and also fills older notifications that have no picture. */
const NIC={};
const NSTOP=['இன்று','நாளை','அனைத்து','மேலும்','குறித்து','பற்றி','செய்தி','தெரிவிக்க','என்பது','இந்த','அந்த','உள்ள','மாணவர்','மாணவி'];
const nWords=t=>t.replace(/[^\p{L}\p{M}\p{N}\s]/gu,' ').split(/\s+/).filter(x=>x.length>=4&&!NSTOP.some(z=>x.startsWith(z)));
const nMatch=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();let c=0;while(c<a.length&&c<b.length&&a[c]===b[c])c++;return c>=4&&c>=0.7*Math.min(a.length,b.length)};
async function autoImg(text){
 if(NIC[text]!==undefined)return NIC[text];
 const kw=[...new Set(nWords(text.slice(0,300)))];if(!kw.length)return NIC[text]='';
 const big=kw.slice().sort((x,y)=>y.length-x.length);
 const qs=[kw.slice(0,4).join(' '),big.slice(0,2).join(' '),...big.slice(0,3)].filter((q,i,a)=>q&&a.indexOf(q)===i);
 const get=async u=>(await(await fetch(u)).json()).query||{};
 const cands=[];
 const score=title=>{const tw=nWords(title.replace(/^File:/,'').replace(/\.\w+$/,'').replace(/_/g,' '));let n=0,L=0;kw.forEach(k=>{if(tw.some(t=>nMatch(k,t))){n++;L=Math.max(L,k.length)}});return{n,L}};
 await Promise.all(qs.flatMap(q=>{const e=encodeURIComponent(q);return[
  ...['ta','en'].map(async lang=>{try{Object.values((await get(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=8&gsrsearch=${e}&prop=pageimages&piprop=thumbnail&pithumbsize=640`)).pages||{}).forEach(p=>{if(p.thumbnail&&!/\.svg/i.test(p.thumbnail.source))cands.push({...score(p.title),i:p.index,src:p.thumbnail.source})})}catch(x){}}),
  (async()=>{try{Object.values((await get(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=${e}&prop=imageinfo&iiprop=url|mime&iiurlwidth=640`)).pages||{}).forEach(p=>{const ii=p.imageinfo&&p.imageinfo[0];if(ii&&/image\/(jpeg|png)/.test(ii.mime))cands.push({...score(p.title),i:p.index+20,src:ii.thumburl})})}catch(x){}})()]}));
 /* only a picture whose own title matches the news words is accepted - otherwise no picture (never a random one) */
 const ok=cands.filter(c=>c.n>=2||(c.n===1&&c.L>=5)).sort((a,b)=>b.n-a.n||b.L-a.L||a.i-b.i);
 for(const c of ok.slice(0,3)){try{return NIC[text]=await nShrink(await(await fetch(c.src)).blob())}catch(x){}}
 return NIC[text]=''}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ks_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function fget(id){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

 <header><span id="hc-ti">💬 உதவி — கேள்வி கேளுங்கள்</span><button type="button" id="hc-x" aria-label="Close">✕</button></header>
 <div id="hc-body"></div>
 <form id="hc-form" autocomplete="off"><textarea id="hc-in" rows="1" maxlength="600" placeholder="உங்கள் சந்தேகத்தை எழுதுங்கள்…"></textarea><button id="hc-go">அனுப்பு</button></form>

<script>
(function(){
 var pan=document.getElementById('hc-pan'),fab=document.getElementById('hc-fab'),bd=document.getElementById('hc-bd'),
     body=document.getElementById('hc-body'),form=document.getElementById('hc-form'),inp=document.getElementById('hc-in'),
     go=document.getElementById('hc-go'),ti=document.getElementById('hc-ti');
 var cid=store.get('ks_chat_id');if(!cid){cid='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);store.set('ks_chat_id',cid)}
 var msgs=[],openT=null,timer=null,sending=false;
 function creds(){return {cid:cid,name:me?me.name:'',role:me?me.role:'VISITOR',pw:me?me.pw:''}}
 function adm(){return !!(typeof isAdmin==='function'&&isAdmin())}
 function fmt(ts){try{return new Date(ts).toLocaleString('ta-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
 function who(m){return m.name||'Visitor'}
 function seenGet(){return +(store.get('ks_chat_seen')||0)}
 function badge(){var n=0;
  if(adm())n=msgs.filter(function(m){return !m.a}).length;
  else{var s=seenGet();n=msgs.filter(function(m){return m.a&&m.at>s}).length}
  bd.textContent=n;bd.classList.toggle('on',n>0)}
 async function load(){
  if(!REMOTE)return;
  try{var r=await api(adm()?'chatall':'chatmine',adm()?Object.assign(creds(),{name:me.name,role:me.role,pw:me.pw}):creds(),20000);
   if(r&&r.ok&&Array.isArray(r.msgs)){msgs=r.msgs;badge();if(pan.classList.contains('on'))draw()}
   else if(r&&!r.ok&&/unknown|invalid action|not supported|no action/i.test(r.err||''))body.innerHTML='<div class="hc-hint">⚠ Server script-இல் Chat வசதி இன்னும் சேர்க்கப்படவில்லை (Code.gs புதுப்பித்து Re-deploy செய்யவும்).</div>';
  }catch(e){}}
 function bubbles(list){
  return list.map(function(m){
   var h='<div class="hc-m hc-q">'+(adm()?'<b style="display:block;font-size:11px;opacity:.8">'+esc(who(m))+'</b>':'')+esc(m.q)+'<span class="hc-t">'+fmt(m.qt)+'</span></div>';
   if(m.a)h+='<div class="hc-m hc-a"><b>Admin பதில்</b>'+esc(m.a)+'<span class="hc-t">'+fmt(m.at)+'</span></div>';
   else if(!adm())h+='<div class="hc-w">Admin பதிலுக்காகக் காத்திருக்கிறது…</div>';
   if(adm())h+='<div class="hc-adm"><button type="button" data-r="'+esc(m.id)+'">'+(m.a?'✏️ பதிலைத் திருத்து':'↩ பதில் அளி')+'</button><button type="button" class="d" data-d="'+esc(m.id)+'">🗑 நீக்கு</button></div>';
   return h}).join('')}
 function draw(){
  var stick=body.scrollHeight-body.scrollTop-body.clientHeight<60;
  if(adm()){
   ti.textContent='💬 பயனாளர் கேள்விகள் (Admin)';
   form.style.display='none';
   if(!msgs.length){body.innerHTML='<div class="hc-hint">இன்னும் கேள்விகள் எதுவும் வரவில்லை.</div>';return}
   var sorted=msgs.slice().sort(function(a,b){return (a.a?1:0)-(b.a?1:0)||b.qt-a.qt});
   body.innerHTML=sorted.map(function(m){
    return '<div>'+bubbles([m])+'</div>'}).join('');
   return}
  ti.textContent='💬 உதவி — கேள்வி கேளுங்கள்';form.style.display='';
  body.innerHTML=msgs.length?bubbles(msgs):'<div class="hc-hint">உங்கள் சந்தேகத்தைக் கீழே எழுதி அனுப்புங்கள். Admin பதில் இங்கேயே தெரியும்.</div>';
  if(stick)body.scrollTop=body.scrollHeight}
 function open(){pan.classList.add('on');fab.classList.add('open');draw();load().then(function(){
   if(!adm()){var mx=msgs.reduce(function(a,m){return Math.max(a,m.at||0)},0);if(mx){store.set('ks_chat_seen',String(mx));badge()}}
   body.scrollTop=adm()?0:body.scrollHeight});
  clearInterval(timer);timer=setInterval(function(){if(!document.hidden)load()},15000);if(!adm())setTimeout(function(){inp.focus()},50)}
 function close(){pan.classList.remove('on');fab.classList.remove('open');clearInterval(timer);timer=null}
 fab.onclick=function(){pan.classList.contains('on')?close():open()};
 document.getElementById('hc-x').onclick=close;
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&pan.classList.contains('on'))close()});
 form.onsubmit=async function(e){e.preventDefault();if(sending)return;var t=inp.value.trim();if(!t)return;
  if(!REMOTE){alert('Chat வசதிக்கு server இணைப்பு தேவை.');return}
  sending=true;go.disabled=true;
  try{var r=await api('chatask',Object.assign(creds(),{text:t}),20000);
   if(r&&r.ok){inp.value='';await load();body.scrollTop=body.scrollHeight}
   else alert((r&&r.err)||'அனுப்ப முடியவில்லை. மீண்டும் முயற்சிக்கவும்.')}
  catch(x){alert('இணைய இணைப்பைச் சரிபார்க்கவும்.')}
  finally{sending=false;go.disabled=false}};
 inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
 body.addEventListener('click',async function(e){if(!adm())return;
  var r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
  if(r){var m=msgs.find(function(x){return x.id===r.dataset.r});if(!m)return;
   var a=prompt('பதில் ('+who(m)+'):\n'+m.q,m.a||'');if(a===null||!a.trim())return;
   var x=await api('chatreply',Object.assign(creds(),{id:m.id,a:a.trim()}),20000);
   if(!x.ok)alert(x.err||'பதிலைச் சேமிக்க முடியவில்லை');await load()}
  if(d){if(!confirm('இந்தக் கேள்வியை நீக்கவா?'))return;
   var y=await api('chatdel',Object.assign(creds(),{id:d.dataset.d}),20000);
   if(!y.ok)alert(y.err||'நீக்க முடியவில்லை');await load()}});
 /* பக்கம் மாறும்போது (login/logout) குறியீடு புதுப்பிக்க */
 var lastU='';setInterval(function(){var u=me?me.name+me.role:'';if(u!==lastU){lastU=u;msgs=[];badge();if(pan.classList.contains('on'))draw();load()}},1500);
 setInterval(function(){if(!pan.classList.contains('on')&&!document.hidden)load()},60000);
 load();
})();
</script>

<script>
/* ---- AUDIO BOOK: PDF-ஐ பக்கம் வாரியாக, பத்தி வாரியாகப் படித்துக் காட்டுதல் (pdf.js + OCR + Browser voice) ----
   தமிழ் எழுத்துப் பிழை திருத்தம்:
   1) PDF-இல் உள்ள எழுத்துகள் "பார்வை வரிசை"யில் (ெ, ே, ை முன்னால்) இருந்தால் தானாகச் சரியான Unicode வரிசைக்கு மாற்றப்படும்.
   2) பழைய Font (Bamini, TSCII, Vanavil...) / படமாக உள்ள (scan) PDF என்றால் தானாக OCR (Tesseract - தமிழ்) மூலம் படிக்கப்படும். */
/* AUDIO BOOK folder: every uploaded file AND every Drive link (even without ".pdf" in its name) is opened in the page-wise / paragraph-wise reader.
   Only real audio / video files, YouTube and H5P links are skipped; if a file turns out not to be a PDF, PR.open() returns false and the normal viewer opens. */
const abPdf=it=>{if(!it||it.h5||!(cur[0]==='video'&&/audio/i.test(cur[5]||'')))return false;
 const ty=(it.ty||'').toLowerCase(),MED=/\.(?:mp3|wav|m4a|aac|ogg|oga|opus|flac|wma|mp4|webm|mov|mkv|avi|m4v|3gp)(?:[?#]|$)/i;
 if(/^(?:audio|video)\//.test(ty)||MED.test(it.n||'')||MED.test(it.u||'')||(it.u&&ytId(it.u)&&!driveId(it.u)))return false;
 return true};
const PR=(()=>{
  const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',CMAPS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/';
  const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  let pdf=null,pg=1,paras=[],pi=0,playing=false,run=0,cache={},wd=null,hinted=false,ocrDoc=false,visDoc=false,tw=null,twP=null,inflight={},loadTk=0;
  const g=id=>document.getElementById(id);
  const mode=()=>(g('prM')&&g('prM').value)||'auto';
  const setH=t=>{const h=g('prH')||g('prL');if(h)h.textContent=t};
  const isTa=t=>((t.match(/[\u0B80-\u0BFF]/g)||[]).length>t.length*.2);
  const lang=t=>isTa(t)?'ta-IN':'en-IN';
  const voice=l=>{const v=speechSynthesis.getVoices()||[],p=l.slice(0,2);return v.find(x=>x.lang.replace('_','-').toLowerCase()===l.toLowerCase())||v.find(x=>x.lang.toLowerCase().startsWith(p))};
  /* ---------- தமிழ் எழுத்துத் திருத்தம் ---------- */
  const C='[\\u0B95-\\u0BB9]',PRE='[\\u0BC6-\\u0BC8]';
  const VIS=new RegExp('(?:^|[^\\u0B95-\\u0BB9\\u0BBE-\\u0BC8\\u0BCA-\\u0BCC])'+PRE+C);   /* சொல்லின் தொடக்கத்தில்/புள்ளிக்குப் பின் ெ ே ை => பார்வை வரிசை */
  const SWAP=new RegExp('('+PRE+')((?:'+C+'\\u0BCD)*'+C+')','g');
  function fixTa(t,vis){
   t=t.replace(/[\u200B-\u200D\u2060\uFEFF\u00AD]/g,'');
   if(vis){
    t=t.replace(SWAP,'$2$1');                                   /* ெப => பெ */
    t=t.replace(/\u0BC6\u0BC6/g,'\u0BC8');                      /* ெெ => ை */
    t=t.replace(new RegExp('('+C+')\\u0BC6\\u0BB3(?![\\u0BCD\\u0BBE-\\u0BCC])','g'),'$1\u0BCC')   /* ெ+ள => ௌ */
   }
   t=t.replace(/([\u0B95-\u0BB9\u0BBE-\u0BCD])[ \t]+([\u0BBE-\u0BCD])/g,'$1$2');   /* குறியீடு தனியாகப் பிரிந்திருந்தால் இணை */
   return t.normalize('NFC')}                                  /* ெ+ா => ொ, ே+ா => ோ */
  function quality(ps){
   const t=ps.join(' ');if(t.replace(/\s/g,'').length<3)return{bad:true,why:'empty'};
   const len=t.length,tam=(t.match(/[\u0B80-\u0BFF]/g)||[]).length;
   const odd=(t.match(/[\u0080-\u024F\uE000-\uF8FF\uFFFD]/g)||[]).length;
   const inv=(t.match(/(?:^|[^\u0B95-\u0BB9\u0BBE-\u0BC8\u0BCA-\u0BCC\u0B82\u0B83])[\u0BBE-\u0BCD]|[\u0BBE-\u0BC8\u0BCA-\u0BCD][\u0BBE-\u0BC8\u0BCA-\u0BCC]/g)||[]).length;
   const emb=(t.match(/[A-Za-z][;\[\]\\`<>=]/g)||[]).length;                  /* Bamini/TSCII போன்ற பழைய font => "jkpo;" */
   if(odd>=4&&odd/len>.015)return{bad:true,why:'legacy'};   /* தமிழும் குழப்பமான குறியீடுகளும் கலந்திருந்தால் (à © Ô ô ▯) */
   if(emb/len>.03&&tam/len<.2)return{bad:true,why:'legacy'};
   if(tam>0&&inv/tam>.02)return{bad:true,why:'broken'};
   return{bad:false}}
  /* ---------- பத்தி பிரித்தல் ---------- */
  function chunks(t){/* Browser voices stop on very long text, so each paragraph is read in short pieces */
   const s=t.match(/[^.!?।]+[.!?।]*\s*/g)||[t],out=[];let c='';
   const push=x=>{x=x.trim();if(x)out.push(x)};
   for(const p of s){
    if(p.length>220){push(c);c='';let w=p.split(/\s+/),a='';for(const x of w){if((a+' '+x).length>180){push(a);a=x}else a=a?a+' '+x:x}push(a);continue}
    if((c+p).length>180){push(c);c=p}else c+=p}
   push(c);return out}
  const speakClean=s=>s.replace(/[•●▪■◆◇○✓✔►▶|_~^*#\[\]{}<>]+/g,' ').replace(/\s+/g,' ').trim();
  function toParas(lines){/* lines: [{y,t}] top→bottom. A new paragraph starts at a bigger vertical gap (or after a finished sentence once long enough) */
   const gaps=[];for(let i=1;i<lines.length;i++)gaps.push(Math.abs(lines[i-1].y-lines[i].y));
   const sorted=gaps.slice().sort((a,b)=>a-b),typ=sorted.length?sorted[Math.floor(sorted.length/2)]:0;
   const out=[];let cur='';
   lines.forEach((l,i)=>{
    if(i>0){const gap=gaps[i-1],ended=/[.!?।:"”’)]$/.test(cur.trim());
     if((typ&&gap>typ*1.35)||(ended&&cur.length>320)){out.push(cur);cur=''}}
    cur+=(cur?' ':'')+l.t});
   if(cur)out.push(cur);
   return out.map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>1)}
  /* ---------- PDF text layer ---------- */
  async function textParas(n){
   const p=await pdf.getPage(n),tc=await p.getTextContent(),lines=[];let cl=null;
   for(const s of tc.items){
    if(typeof s.str!=='string'||!s.str)continue;
    const x=s.transform[4],y=s.transform[5],h=Math.abs(s.transform[3])||s.height||10,w=s.width||0;
    if(cl&&Math.abs(y-cl.y)<h*.5){
     const gap=x-cl.e;
     if(gap>h*.3&&!/\s$/.test(cl.t)&&!/^\s/.test(s.str)&&!/^[\u0BBE-\u0BCD]/.test(s.str))cl.t+=' ';
     cl.t+=s.str;cl.e=x+w}
    else{cl={y,t:s.str,e:x+w};lines.push(cl)}}
   const ls=lines.filter(l=>l.t.trim());
   if(!visDoc&&VIS.test(ls.map(l=>l.t).join('\n')))visDoc=true;
   ls.forEach(l=>{l.t=fixTa(l.t,visDoc)});
   return toParas(ls)}
  /* ---------- OCR (Tesseract: தமிழ் + English) ---------- */
  async function getWorker(){
   if(tw)return tw;if(twP)return twP;
   twP=(async()=>{
    setH('⏳ OCR தமிழ் மொழிக் கோப்பு ஏற்றப்படுகிறது… (முதல் முறை மட்டும், Internet தேவை)');
    if(!window.Tesseract)await loadJs(TESS);
    const w=await Tesseract.createWorker(['tam','eng'],1,{logger:m=>{if(m&&m.status&&m.status==='recognizing text')setH('🔎 OCR: எழுத்துகள் படிக்கப்படுகின்றன '+Math.round((m.progress||0)*100)+'%')}});
    tw=w;return w})();
   try{return await twP}catch(e){twP=null;throw e}}
  function ocrParas(d){
   let ps=[];
   if(d.paragraphs&&d.paragraphs.length)ps=d.paragraphs.map(x=>x.text);
   else if(d.blocks&&d.blocks.length)d.blocks.forEach(b=>(b.paragraphs||[]).forEach(x=>ps.push(x.text)));
   if(!ps.length)ps=(d.text||'').split(/\n\s*\n/);
   return ps.map(x=>fixTa(String(x||'').replace(/[|¦_~^`]+/g,' ').replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').trim(),false)).filter(x=>x.replace(/[\s\d\W]/g,'').length>1)}
  async function ocrPage(n){
   const p=await pdf.getPage(n),v0=p.getViewport({scale:1}),sc=Math.min(3,Math.max(1.6,2000/v0.width)),v=p.getViewport({scale:sc});
   const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
   const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
   await p.render({canvasContext:cx,viewport:v}).promise;
   const w=await getWorker();setH('🔎 OCR: பக்கம் '+n+' படிக்கப்படுகிறது…');
   const r=await w.recognize(c);c.width=c.height=0;
   return ocrParas(r.data)}
  async function build(n){
   const m=mode();
   if(m==='ocr'||(m==='auto'&&ocrDoc)){
    try{return await ocrPage(n)}catch(e){setH('⚠ OCR ஏற்ற முடியவில்லை (Internet / Browser சரிபார்க்கவும்). PDF text பயன்படுத்தப்படுகிறது.')}
    return textParas(n)}
   const tp=await textParas(n);
   if(m==='text')return tp;
   const q=quality(tp);
   if(q.bad){
    try{const o=await ocrPage(n);if(o.length){if(q.why!=='empty'||n<=3)ocrDoc=true;return o}}

  function pageParas(n){
