<style>
:root{--gold:#ffc000;--navy:#1a2f8f;--rose:#e8294b;--blue:#2e75b6;--red:#e00000;--grey:#d0cece;--ink:#14213d}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Tamil',system-ui,Arial,sans-serif;color:var(--ink);background:#fffdf5}
.wrap{max-width:1180px;margin:0 auto;padding:8px}
header{background:var(--gold);border:2px solid var(--ink);display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:8px;padding:8px}
.logo{width:100px;height:100px;border-radius:50%;background:#fff;border:5px solid var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;margin:auto}
.logo small{font-size:10px;font-weight:800;color:var(--navy)}
.hc{text-align:center}
.quote{font-size:13px;font-weight:700;font-style:italic;text-align:left}
.title{font-size:clamp(30px,6vw,56px);font-weight:800;margin:2px 0;line-height:1.2}
.title b{color:var(--navy)}.title i{color:var(--rose);font-style:normal}
.tag{display:inline-block;background:#fff;border:1px solid #f08a00;padding:2px 12px;font-weight:800;color:var(--navy);font-size:clamp(13px,2.4vw,20px)}
.tag span{color:#f08a00}
button{font:inherit;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;box-shadow:0 2px 4px #0003}
.btn:hover{background:#245d8f}.btn.sm{padding:5px 10px;font-size:13px}.btn.dk{background:var(--navy)}.btn.rd{background:#b3261e}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.auth{max-width:620px;margin:20px auto;position:relative}
.auth .top{text-align:right;margin-bottom:6px}
.row{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;margin:12px 0}
.row label{text-align:right;font-size:20px}
.pw{position:relative}.pw input{padding-right:52px}.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer}
.msg.ok{color:#1b7a2f}
/* hide the browser's own show-password icon (Edge/IE) so only our eye button shows */
.pw input::-ms-reveal,.pw input::-ms-clear{display:none!important}
.pw input::-webkit-credentials-auto-fill-button,.pw input::-webkit-contacts-auto-fill-button{visibility:hidden;display:none!important;pointer-events:none;position:absolute;right:0}
input,select,textarea{font:inherit;width:100%;padding:12px;border:3px solid #000;background:#fff;font-size:17px}
.acts{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.msg{text-align:center;color:#b3261e;font-weight:700;min-height:24px}
.bar{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin:8px 0}
.bar div,.bar button{background:var(--red);color:#ff0;border:2px solid var(--ink);text-align:center;font-weight:800;font-size:20px;padding:8px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav .btn{font-size:clamp(13px,1.8vw,19px);padding:10px 14px;flex:1 1 auto}
nav .btn.on{background:var(--navy)}
.home{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:12px}
.home h3{text-align:center;margin:4px 0 6px}
.box{background:var(--grey);border:2px solid var(--ink);border-radius:22px;padding:18px;min-height:110px}
.box.tall{min-height:420px}
.newsl{list-style:none;margin:0;padding:0;max-height:400px;overflow:auto}.newsl li{cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;padding:8px 28px 8px 18px;border-bottom:1px dashed #cfd6e6;line-height:1.55;font-weight:600}.newsl li:last-child{border-bottom:0}.newsl li::before{content:'◆';position:absolute;left:0;top:11px;font-size:10px;color:#ff9f1c}.newsl li:hover{background:#fff7ec}.newsl li.speaking{background:#fff3d6;box-shadow:inset 3px 0 0 #ff9f1c}.newsl li::after{content:"🔊";position:absolute;right:4px;top:9px;font-size:13px;opacity:.5}.newsl li.speaking::after{content:"⏹";opacity:1}.newsl a.nl{color:#1b6ca8;font-size:12px;text-decoration:none;margin-left:4px}.nd{font-size:.72em;font-weight:600;opacity:.8;margin-left:4px}.nitem{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:10px}.nbt{display:flex;gap:6px;margin-top:8px}
.kural{font-size:22px;font-weight:700;line-height:1.7}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.crumb h2{margin:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fold{background:#fff3c4;border:2px solid #c99700;border-radius:12px;padding:18px;font-weight:700;text-align:left;font-size:18px}
.fold:hover{background:#ffe48a}
.fwrap{display:flex;flex-direction:column;gap:6px}.fwrap .fold{width:100%}
.item{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.item strong{font-size:18px}
.sh{display:flex;gap:5px;flex-wrap:wrap}
.empty{padding:24px;text-align:center;background:#fff;border:2px dashed #999;border-radius:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{background:var(--navy);color:#fff;text-align:center;padding:6px;font-weight:700}
.cal .d{background:#fff;border:1px solid #888;min-height:84px;padding:4px;font-size:13px;text-align:left;overflow:hidden}
.cal .d b{display:block;font-size:15px}.cal .d.has{background:#fff3c4}.cal .d.today{border:3px solid var(--red)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:1000;overflow:auto}
#modal div{background:#fff;width:min(900px,100%);padding:10px;border-radius:10px}
#modal iframe{width:100%;aspect-ratio:16/9;border:0}

.ban{width:100%;margin:0;border-bottom:3px solid var(--ink);background:var(--gold);line-height:0}.ban img{width:100%;height:auto;display:block}
#modal div{position:relative}.vw{font-size:12px;font-weight:600;color:#1b6ca8;margin-left:8px;white-space:nowrap}.x{position:absolute;top:-14px;right:-6px;background:#b3261e;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:18px}
#modal video{width:100%;max-height:75vh;background:#000}#modal iframe.pdf{height:75vh;aspect-ratio:auto}
#up{border:3px solid var(--ink);border-radius:12px;padding:18px;width:min(520px,94vw)}#up::backdrop{background:#0009}#up input{margin:4px 0 12px;padding:9px;border-width:2px}#up h3{margin-top:0}.hint{font-size:13px;color:#555;margin:-6px 0 10px}.ypv{display:none;align-items:center;gap:10px;margin:-6px 0 10px;font-size:13px}.ypv img{width:96px;height:54px;object-fit:cover;border-radius:6px;background:#000}.ypv.ok{display:flex;color:#0b6b2e}.ypv.bad{display:block;color:#b3261e}
html,body{margin:0;max-width:100%;overflow-x:hidden}.ban{overflow:hidden}.ban img{display:block;width:100%;max-width:100%;height:auto;min-width:0}
.ban picture{display:block;width:100%}
.ban,.ban picture,.ban img{display:block;width:100%;max-width:100%;margin:0;padding:0}.ban img{height:auto}
/* ---- Face attendance (scoped to #fa) ---- */
#fa{--ok:#1a7f37;--bad:#c62828;max-width:640px;margin:12px auto}
#fa .fa-sync{text-align:center;font-weight:700;min-height:22px;color:#b3261e}
#fa .fa-tabs{display:flex}#fa .fa-tabs button{flex:1;padding:12px;border:0;background:#eee;font-size:16px;font-weight:700}
#fa .fa-tabs button.on{background:var(--navy);color:#fff}
#fa #fa-cam{position:relative;background:#000;border-radius:10px;overflow:hidden;margin:10px 0}
#fa video{width:100%;display:block;transform:scaleX(-1);min-height:150px}
#fa #fa-st{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;padding:6px;font-size:14px;text-align:center}
#fa .fr{display:flex;gap:8px;margin:8px 0}
#fa input,#fa select{flex:1;min-width:0;width:100%;padding:10px;border:1px solid #999;border-radius:8px;font-size:16px}
#fa .fr button{flex:1;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700}
#fa .fl>div{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
#fa #fa-log>div{border-left:6px solid var(--ok)}
#fa .fa-del{background:var(--bad);color:#fff;border:0;border-radius:6px;padding:6px 10px}
#fa .fa-tw{overflow-x:auto}#fa table{border-collapse:collapse;width:100%}
#fa th,#fa td{border:1px solid #bbb;padding:8px;text-align:center}#fa th{background:var(--gold)}
#fa td.p{background:#d8f3dc;color:var(--ok);font-weight:700;cursor:pointer}#fa td.a{background:#fde0e0;color:var(--bad);cursor:pointer}
/* ===== Etrain-style theme (design only) ===== */
:root{--gold:#ff9f1c;--navy:#1f2f56;--rose:#ff6b35;--blue:#ff9f1c;--ink:#2b3253;--grey:#f4f7fb;--grad:linear-gradient(135deg,#ff9f1c,#ff6b35)}
body{font-family:'Poppins','Noto Sans Tamil',system-ui,Arial,sans-serif;background:#fff;color:var(--ink)}
.ban{border-bottom:0;box-shadow:0 6px 24px #1f2f5624;background:#fff7ec}
.wrap{padding:14px}
.btn{background:var(--grad);border-radius:30px;padding:10px 24px;font-weight:600;box-shadow:0 8px 18px #ff6b3540;transition:.3s}
.btn:hover{background:var(--navy);transform:translateY(-2px);box-shadow:0 8px 18px #1f2f5640}
.btn.sm{padding:6px 15px}.btn.dk{background:var(--navy)}.btn.rd{background:#e5484d}
nav{background:#fff;border-radius:20px;box-shadow:0 8px 28px #1f2f5618;padding:8px;gap:6px}
nav .btn{background:transparent;color:var(--navy);box-shadow:none;transform:none}
nav .btn:hover{background:#fff3e0;color:#ff6b35}
nav .btn.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px #ff6b3540}
.bar{gap:10px;margin:12px 0}
.bar div,.bar button{background:var(--navy);color:#fff;border:0;border-radius:14px;font-size:17px;font-weight:600}
.bar button{background:var(--grad);cursor:pointer}
.home h3,.crumb h2{color:var(--navy);font-weight:700}
.box{background:#fff;border:0;border-top:5px solid #ff9f1c;border-radius:22px;box-shadow:0 12px 34px #1f2f5618}
.kural{color:var(--navy)}
.nitem{background:#fff7ec;border:0;border-left:5px solid #ff9f1c;border-radius:14px}
.fold{background:#fff;color:var(--navy);border:0;border-left:6px solid #ff9f1c;border-radius:18px;box-shadow:0 10px 28px #1f2f5616;transition:.3s}
.fold:hover{background:#fff7ec;transform:translateY(-4px)}
.item{border:0;border-radius:18px;box-shadow:0 8px 24px #1f2f5614}
.empty{background:#fff7ec;border:2px dashed #ff9f1c;border-radius:18px}
input,select,textarea{border:2px solid #e3e8f2;border-radius:14px;padding:12px 16px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#ff9f1c;outline:0;box-shadow:0 0 0 4px #ff9f1c26}
.row label{color:var(--navy);font-weight:600}
.auth{background:#fff;border-radius:24px;box-shadow:0 14px 40px #1f2f5620;padding:26px}
.cal .h{background:var(--navy);border-radius:10px}
.cal .d{border:1px solid #e3e8f2;border-radius:10px}.cal .d.has{background:#fff3e0}.cal .d.today{border:3px solid #ff6b35}
#modal div{border-radius:20px}.x{background:#e5484d}
#up{border:0;border-radius:24px;box-shadow:0 20px 50px #0005}
#fa .fa-tabs{background:#fff;border-radius:30px;box-shadow:0 8px 24px #1f2f5618;padding:5px;gap:4px}
#fa .fa-tabs button{border-radius:30px;background:transparent;color:var(--navy)}
#fa .fa-tabs button.on{background:var(--grad);color:#fff}
#fa #fa-cam{border-radius:20px;box-shadow:0 10px 30px #1f2f5630}
#fa .fr button{background:var(--grad);border-radius:30px;padding:11px}
#fa .fl>div{border:0;border-radius:14px;box-shadow:0 6px 18px #1f2f5614}
#fa th{background:var(--navy);color:#fff}
#fa .fa-help{background:#fff7ec;border-color:#ff9f1c;border-radius:16px}
#fa .fa-help button{background:var(--grad);border-radius:30px}

/* digital clock - visible on every page (login included) */
.clk{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:6px 12px;text-align:center}
.clk #clkD{font-size:clamp(13px,2.2vw,17px);font-weight:600;opacity:.95}
.clk #clkT{font-family:"Courier New",ui-monospace,monospace;font-size:clamp(20px,4vw,30px);font-weight:700;letter-spacing:2px;background:#0b1536;color:#ffc000;border-radius:8px;padding:2px 14px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px #ffc00080}

/* ---- Home menu: horizontal buttons ---- */
.hmenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:12px 0 6px}
.hm-i{background:#fff;border:2px solid #f0d9bd;border-radius:14px;padding:10px 16px;font-size:clamp(13px,2.4vw,16px);font-weight:700;color:var(--navy);cursor:pointer;line-height:1.25}
.hm-i:hover{background:#fff3e0;color:#ff6b35}
.hm-m{background:var(--grad);color:#fff;border-color:transparent}
.hm-m:hover{background:var(--grad);color:#fff;filter:brightness(1.08)}
.hm-add{border-style:dashed}
.hm-hid .hm-i{opacity:.5}
.hm-s{background:#e8f1ff;border-color:#b9d3f5}.hm-s:hover{background:#d6e6ff;color:var(--navy)}
.hm-r{display:inline-flex;align-items:center;gap:3px;background:#fff;border:2px solid #f0d9bd;border-radius:14px;padding:3px}
.hm-r .hm-i{border:0}
.hm-e{border:0;background:#fff3e0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px;color:var(--navy)}
.hm-e:hover{background:#ffe1c2}.hm-x{color:#b3261e}
/* ---- NAV dropdown ---- */
nav{align-items:flex-start}
nav .btn{flex:0 0 auto}
.dd{position:relative;flex:0 0 auto}
.dd-m{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:300px;max-width:92vw;background:#fff;border:1px solid #f0d9bd;border-radius:16px;box-shadow:0 14px 34px #1f2f5633;padding:6px;z-index:20}
.dd.open .dd-m{display:flex;flex-direction:column;gap:2px}
.dd-i{background:transparent;border:0;border-radius:10px;text-align:left;padding:10px 14px;font-size:15px;font-weight:600;color:var(--navy);width:100%}
.dd-i:hover{background:#fff3e0;color:#ff6b35}
.dd-i.on{background:var(--grad);color:#fff}


/* ---- user info on nav row ---- */
nav{align-items:center}
.ubar{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ubar span,.ubar button{background:var(--navy);color:#fff;border:0;border-radius:14px;padding:8px 14px;font-size:15px;font-weight:600;white-space:nowrap}
.ubar .ub-o{background:var(--grad);cursor:pointer}


/* ---- clock row: HOME/MENU left, clock centre, user right ---- */
.clk{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:left;padding:8px 14px;position:relative;z-index:30}
.clk-c{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;text-align:center}
.clk-l{display:flex;gap:8px;align-items:center;justify-self:start}
.clk-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-self:end;justify-content:flex-end}
.clk .nv,.clk-r span,.clk-r button{border:0;border-radius:14px;padding:7px 14px;font-size:15px;font-weight:600;white-space:nowrap;color:#fff;background:rgba(255,255,255,.14);cursor:pointer;font-family:inherit}
.clk-r span{cursor:default}
.clk .nv:hover{background:rgba(255,255,255,.28)}
.clk .nv.on{background:var(--grad)}
.clk .ub-o{background:var(--grad)}
.clk .dd-m{top:calc(100% + 10px)}


/* =====================================================================
   RESPONSIVE VIEWS
   WEB    : 1025px and up
   TAB    : 600px - 1024px
   MOBILE : up to 599px
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
img,video,iframe{max-width:100%}
.item strong{overflow-wrap:anywhere;min-width:0}
.fold{overflow-wrap:anywhere}

/* ---------- WEB (desktop) ---------- */
@media(min-width:1025px){
 .wrap{max-width:1280px;padding:18px 24px}
 .home{grid-template-columns:1.6fr 1fr;gap:20px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
 .box{padding:22px}
 #fa{max-width:760px}
 .item:hover{box-shadow:0 12px 30px #1f2f5624}
}
@media(min-width:1500px){
 .wrap{max-width:1400px}
 .kural{font-size:24px}
}

/* ---------- TAB ---------- */
@media(min-width:600px) and (max-width:1024px){
 .wrap{max-width:100%;padding:14px 18px}
 .home{grid-template-columns:1.3fr 1fr;gap:14px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
 .box{padding:18px}.box.tall{min-height:340px}
 .kural{font-size:20px}
 .auth{max-width:560px}
 #fa{max-width:700px}
 .clk .nv,.clk-r span,.clk-r button{padding:9px 14px;min-height:40px}
 .btn,.btn.sm{min-height:38px}
 .cal .d{min-height:72px;font-size:12px}
}
/* tablet portrait: stack the home panels */
@media(min-width:600px) and (max-width:860px){
 .home{grid-template-columns:1fr}
}

/* ---------- clock row: tab-portrait + mobile (up to 900px) ---------- */
@media(max-width:900px){
 .clk{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:8px 12px}
 .clk-c{order:-1;width:100%;justify-content:center}
 .clk-l,.clk-r{justify-self:auto}
 .clk-l:empty,.clk-r:empty{display:none}
 .clk-c:only-child,.clk-l:empty~.clk-c{order:0}
}

/* ---------- MOBILE ---------- */
@media(max-width:599px){
 .wrap{padding:10px}
 .title{font-size:clamp(22px,8vw,34px)}
 .home{grid-template-columns:1fr;gap:12px}
 .box{padding:14px;border-radius:18px;min-height:90px}
 .box.tall{min-height:240px}
 .kural{font-size:18px;line-height:1.6}
 .crumb{gap:6px;margin:10px 0}.crumb h2{font-size:18px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
 .fold{padding:14px;font-size:15px;border-radius:14px}

 /* login */
 .auth{margin:10px 0;padding:16px;border-radius:18px;max-width:100%}
 .row{grid-template-columns:1fr;gap:4px;margin:10px 0}
 .row label{text-align:left;font-size:16px}
 .acts{gap:10px}.acts .btn{flex:1 1 130px}
 input,select,textarea{font-size:16px;padding:11px 14px}

 /* list rows: text on top, buttons below, full width */
 .item{flex-direction:column;align-items:stretch;gap:10px;padding:12px}
 .item strong{font-size:16px}
 .item .sh{width:100%}
 .item .sh .btn{flex:1 1 auto;min-height:40px}

 /* clock row */
 .clk{padding:8px 10px;gap:8px}
 .clk #clkT{font-size:clamp(20px,7vw,26px);padding:2px 10px;letter-spacing:1px}
 .clk #clkD{font-size:13px}
 .clk .nv,.clk-r span,.clk-r button{padding:8px 12px;font-size:14px;min-height:40px}
 .clk-r{gap:6px}
 /* menu opens as a full-width panel under the clock row */
 .clk .dd{position:static}
 .clk .dd-m{left:10px;right:10px;top:100%;width:auto;min-width:0;max-width:none;transform:none;max-height:65vh;max-height:65dvh;overflow-y:auto}
 .dd-i{padding:12px 14px;font-size:15px}

 /* calendar */
 .cal{gap:2px}
 .cal .h{padding:4px 0;font-size:11px;border-radius:6px}
 .cal .d{min-height:52px;font-size:10px;padding:2px;border-radius:6px}
 .cal .d b{font-size:12px}

 /* video / pdf popup */
 #modal{padding:10px;align-items:flex-start}

<script>

async function api(action,o,ms){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),ms||30000);
  let t;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},o||{})),signal:ac.signal});t=await r.text()}
  finally{clearTimeout(to)}
 try{return JSON.parse(t)}catch(e){return {ok:false,err:'The server sent an unexpected reply. Check that the Apps Script is deployed as a Web App (access: Anyone) and has been re-deployed after changes.'}}
}
/* ---- SAVE / SYNC ----
   FIX: previously a slow background pull() (page open, menu click, 30-second timer, login) could return AFTER the Admin had edited a name,
   and Object.assign(db, ...) wrote the OLD server copy over the new name (and the old copy was then pushed back). So the first Edit seemed to do nothing.
   Now: every save() bumps syncGen; a pull() whose answer arrives after any local change / while a push is running or pending is thrown away. */
let saveT=null,syncGen=0,pushing=false,pushAgain=false,pendingPush=false,dirty=false,pullSig='',lastPull=0;
const save=()=>{syncGen++;store.set('ks_db',JSON.stringify(db));if(REMOTE&&me&&me.admin){dirty=true;pendingPush=true;clearTimeout(saveT);saveT=setTimeout(pushDb,100)}};
const pushBody=()=>({name:me.name,role:me.role,pw:me.pw,data:{folders:db.folders,items:db.items,notif:db.notif,cal:db.cal}});
async function pushDb(){
  if(!REMOTE||!me||!me.admin)return;
  if(pushing){pushAgain=true;return}
  pushing=true;pendingPush=false;const g=syncGen;
  try{const r=await api('save',pushBody());if(r.ok){if(g===syncGen)dirty=false}else alert(r.err||'Save to Google Drive failed.')}
  catch(e){alert('Could not save to Google Drive. Check the internet connection.')}
  finally{pushing=false;syncGen++;if(pushAgain||pendingPush){pushAgain=false;clearTimeout(saveT);saveT=setTimeout(pushDb,0)}}
}
/* tab closed right after an edit: try to send the last change */
addEventListener('pagehide',()=>{if(REMOTE&&me&&me.admin&&(dirty||pendingPush)){try{fetch(API,{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:'save'},pushBody()))}).catch(()=>{})}catch(e){}}});
let pullP=null,srvWhy='';
function pull(){if(!REMOTE)return Promise.resolve(false);if(pullP)return pullP;const g0=syncGen;
  pullP=(async()=>{try{let r=null;for(let k=0;k<2&&!(r&&r.ok);k++){if(k)await new Promise(z=>setTimeout(z,2500));const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);try{const x=await fetch(API,{signal:ac.signal,redirect:'follow'}),tx=await x.text();try{r=JSON.parse(tx);if(!r.ok)srvWhy='சர்வர் பதில்: '+String(r.err||'ok=false')}catch(e2){r=null;srvWhy='HTTP '+x.status+' – JSON அல்ல: '+tx.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,90)}}catch(e){r=null;srvWhy=(e&&e.name==='AbortError')?'நேரம் முடிந்தது (timeout)':'இணைப்பு தடுக்கப்பட்டது/கிடைக்கவில்லை ('+String((e&&e.message)||e)+')'}finally{clearTimeout(to)}}
    if(!r)throw new Error('net');lastPull=Date.now();srvWarn(!r.ok);
    if(r.ok){
      if(syncGen!==g0||pushing||pendingPush||dirty)return false;/* local edit happened meanwhile: keep it, ignore this old copy */
      const sig=JSON.stringify(r.data);if(sig===pullSig)return false;/* nothing new: no re-render */
      pullSig=sig;(function(dt){if(!dt||typeof dt!=='object')return;if(dt.folders&&typeof dt.folders==='object')db.folders=dt.folders;if(dt.items&&typeof dt.items==='object')db.items=dt.items;if(typeof dt.notif==='string')db.notif=dt.notif;if(dt.cal&&typeof dt.cal==='object')db.cal=dt.cal})(r.data);applyNav();store.set('ks_db',JSON.stringify(db));return true}
  }catch(e){srvWarn(true)}return false})().finally(()=>{pullP=null});return pullP}
function srvWarn(bad){let b=document.getElementById('srvwarn');
 if(!bad){if(b)b.remove();return}
 if(b)return;
 b=document.createElement('div');b.id='srvwarn';b.className='noprint';
 b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#b3261e;color:#fff;padding:8px 40px 8px 12px;font-weight:700;text-align:center;font-size:14px;line-height:1.5';
 b.innerHTML='<div>⚠ சர்வரிலிருந்து தரவு வரவில்லை. சேமித்த தரவு காட்டப்படுகிறது.</div><div style="font-weight:500;font-size:12.5px">இணைய இணைப்பைச் சரிபார்க்கவும்; இந்தப் பக்கத்தை Chrome/Safari போன்ற Browser-இல் நேரடியாகத் திறக்கவும் (Preview/பகிர்வுத் திரையில் தரவு வராது). தொடர்ந்தால் Admin-ஐத் தொடர்பு கொள்ளவும்.</div><div style="font-weight:500;font-size:11.5px;opacity:.9">காரணம்: '+String(srvWhy||'தெரியவில்லை').replace(/[<>&]/g,' ')+'</div><button type="button" style="margin-top:4px;padding:3px 12px;border:0;border-radius:8px;font-weight:700;background:#fff;color:#b3261e;cursor:pointer">↻ மீண்டும் முயல்</button><span role="button" aria-label="Close" style="position:absolute;right:12px;top:6px;font-size:20px;cursor:pointer">✕</span>';
 b.querySelector('button').onclick=()=>{b.remove();lastPull=0;pull().then(ok=>{if(ok)render()})};
 b.querySelector('span').onclick=()=>b.remove();
 document.body.appendChild(b)}

const stuHide=()=>{const a=(db.folders||{})['__stuhide'];return Array.isArray(a)?a:[]};

/* Not logged in (visitor) = same view as STUDENT / PARENTS: read-only, no login needed */

LV.cvid=['f2','cat2','lesson','items'];/* COMPETITIVE EXAM: NMMS / TRUST › VIDEOS / INTRACTIVE CONTENT / ONLINE EXAM / WORK SHEETS (PDF File) › Lesson › Upload */

const F_DEF={f1:['Online Interactive Sheet','ONLINE EXAM'],f2:['NMMS','TRUST'],term:['TERM 1','TERM 2','TERM 3'],sub:['தமிழ்','ENGLISH','கணக்கு','சூழ்நிலையியல்','அறிவியல்','சமூக அறிவியல்'],med:['TAMIL MEDIUM','ENGLISH MEDIUM'],cat:['VIDEOS','INTRACTIVE CONTENT','WORK SHEETS (PDF File)','TEXT BOOK','AUDIO BOOK'],cat2:['VIDEOS','INTRACTIVE CONTENT','ONLINE EXAM','WORK SHEETS (PDF File)']};

const NAV_KEY='__nav';

function navCfg(){const a=(db.folders||{})[NAV_KEY];if(!Array.isArray(a))return null;
 const r=a.map(x=>{const p=String(x).split('|');return{k:p[0],t:p[1],l:p.slice(2).join('|')}}).filter(x=>x.k&&x.l&&!NAV_GONE.includes(x.k));

 return r}

function migCvid(){const F=db.folders||(db.folders={});if(F['__cvmig'])return;let ch=false;
 Object.keys(db.items||{}).forEach(k=>{const p=k.split('/');if(p[0]==='cvid'&&p.length===3){const nk=p[0]+'/'+p[1]+'/VIDEOS/'+p[2];db.items[nk]=(db.items[nk]||[]).concat(db.items[k]);delete db.items[k];ch=true}});
 Object.keys(F).forEach(k=>{const p=k.split('/');if(p[0]==='cvid'&&p.length===2&&Array.isArray(F[k])){const nk=k+'/VIDEOS';if(!F[nk])F[nk]=F[k];delete F[k];ch=true}});
 F['__cvmig']=['1'];if(ch&&isAdmin())setTimeout(()=>{try{save()}catch(e){}},0)}

function migMed(){const F=db.folders||(db.folders={});if(F['__medmig'])return;let ch=false;
 ['items','folders'].forEach(t=>{const o=db[t]||{};Object.keys(o).forEach(k=>{const p=k.split('/');

   if(Array.isArray(o[k])&&Array.isArray(o[nk]))o[nk]=o[nk].concat(o[k]);else if(!(nk in o))o[nk]=o[k];delete o[k];ch=true}})});

const KURAL=[["அகர முதல எழுத்தெல்லாம் ஆதி பகவன் முதற்றே உலகு.","எழுத்துகள் எல்லாம் அகரத்தை முதலாகக் கொண்டுள்ளன; அதுபோல உலகம் இறைவனை முதலாகக் கொண்டது."],["கற்றதனால் ஆய பயனென்கொல் வாலறிவன் நற்றாள் தொழாஅர் எனின்.","தூய அறிவுடைய இறைவனின் நல்ல திருவடிகளைத் தொழாவிட்டால், கற்ற கல்வியால் என்ன பயன்?"],["வான்நின்று உலகம் வழங்கி வருதலால் தான்அமிழ்தம் என்றுணரற் பாற்று.","மழை பெய்வதால்தான் உலகம் வாழ்கிறது; ஆகவே மழையே உயிர்களுக்கு அமிழ்தம் போன்றது."],["நீரின்றி அமையாது உலகெனின் யார்யார்க்கும் வான்இன்று அமையாது ஒழுக்கு.","நீர் இல்லாமல் உலகம் இயங்காது; அந்த நீருக்கு மழை இன்றியமையாதது போல, ஒழுக்கமும் எல்லோருக்கும் இன்றியமையாதது."],["ஒல்லும் வகையான் அறவினை ஓவாதே செல்லும்வாய் எல்லாம் செயல்.","முடிந்த வழிகளிலெல்லாம், முடிந்த இடங்களிலெல்லாம் இடைவிடாமல் அறச்செயல்களைச் செய்ய வேண்டும்."],["மனத்துக்கண் மாசிலன் ஆதல் அனைத்தறன் ஆகுல நீர பிற.","மனத்தில் குற்றம் இல்லாமல் இருப்பதே அறம்; மற்றவை எல்லாம் ஆரவாரத்தன்மை உடையவை."],["அன்பும் அறனும் உடைத்தாயின் இல்வாழ்க்கை பண்பும் பயனும் அது.","இல்வாழ்க்கையில் அன்பும் அறமும் இருந்தால், அதுவே அதன் பண்பும் பயனும் ஆகும்."],["தம்பொருள் என்பதம் மக்கள் அவர்பொருள் தம்தம் வினையான் வரும்.","பிள்ளைகளே பெற்றோரின் உண்மையான செல்வம்; அவர்களின் நற்செயல்களால் அந்தச் செல்வம் சிறக்கும்."],["குழலினிது யாழினிது என்பதம் மக்கள் மழலைச்சொல் கேளா தவர்.","தம் குழந்தைகளின் மழலைச் சொல்லைக் கேட்காதவர்களே குழலும் யாழும் இனிமை என்பார்கள்."],["தந்தை மகற்காற்றும் நன்றி அவையத்து முந்தி இருப்பச் செயல்.","தந்தை மகனுக்குச் செய்யும் நன்மை, அவனை அறிஞர் அவையில் முதன்மையானவனாக்குவதே."],["மகன்தந்தைக் காற்றும் உதவி இவன்தந்தை என்நோற்றான் கொல்எனும் சொல்.","\"இவனைப் பெற்ற தந்தை என்ன தவம் செய்தானோ!\" என்று பிறர் சொல்லுமாறு நடப்பதே மகன் தந்தைக்குச் செய்யும் உதவி."],["அன்பிற்கும் உண்டோ அடைக்குந்தாழ் ஆர்வலர் புன்கண்நீர் பூசல் தரும்.","அன்பை மறைத்து வைக்கும் தாழ்ப்பாள் இல்லை; அன்புடையவரின் கண்ணீரே அதை வெளிப்படுத்திவிடும்."],["அன்போடு இயைந்த வழக்கென்ப ஆருயிர்க்கு என்போடு இயைந்த தொடர்பு.","உயிர் உடலோடு பொருந்தி இருப்பது அன்போடு பொருந்தி வாழ்வதற்கே என்பர்."],["செல்விருந்து ஓம்பி வருவிருந்து பார்த்திருப்பான் நல்விருந்து வானத் தவர்க்கு.","வந்த விருந்தினரை உபசரித்து, வரப்போகும் விருந்தினரை எதிர்பார்த்திருப்பவன் வானவர்க்கும் விருந்தினன் ஆவான்."],["மோப்பக் குழையும் அனிச்சம் முகந்திரிந்து நோக்கக் குழையும் விருந்து.","அனிச்சப்பூ முகர்ந்தாலே வாடும்; விருந்தினர் முகம் மாறியதைப் பார்த்தாலே வாடிவிடுவர்."],["இனிய உளவாக இன்னாத கூறல் கனியிருப்பக் காய்கவர்ந் தற்று.","இனிய சொற்கள் இருக்க கடுஞ்சொற்களைப் பேசுவது, கனி இருக்கக் காயைத் தின்பது போன்றது."],["செய்யாமல் செய்த உதவிக்கு வையகமும் வானகமும் ஆற்றல் அரிது.","தான் முன்பு உதவி செய்யாமல் இருந்தும் பிறர் செய்த உதவிக்கு, மண்ணுலகமும் விண்ணுலகமும் ஈடாகாது."],["நன்றி மறப்பது நன்றன்று நன்றல்லது அன்றே மறப்பது நன்று.","பிறர் செய்த உதவியை மறப்பது நல்லதன்று; அவர் செய்த தீமையை அன்றே மறந்துவிடுவது நல்லது."],["எண்ணிய எண்ணியாங் கெய்துப எண்ணியார் திண்ணிய ராகப் பெறின்.","நினைத்தவர் உறுதியுடையவராக இருந்தால், தாம் நினைத்தவற்றை நினைத்தபடியே அடைவார்கள்."],["தீயவை தீய பயத்தலால் தீயவை தீயினும் அஞ்சப் படும்.","தீய செயல்கள் தீமையையே தருவதால், அவை நெருப்பை விடவும் அஞ்சத் தக்கவை."],["ஒழுக்கம் விழுப்பந் தரலான் ஒழுக்கம் உயிரினும் ஓம்பப் படும்.","ஒழுக்கம் சிறப்பைத் தருவதால், உயிரைவிடவும் ஒழுக்கத்தையே பேண வேண்டும்."],["பொறுத்தல் இறப்பினை என்றும் அதனை மறத்தல் அதனினும் நன்று.","தீமை செய்தவரைப் பொறுத்துக்கொள்வது நல்லது; அதை மறந்துவிடுவது அதைவிடவும் நல்லது."],["ஒழுக்காறாக் கொள்க ஒருவன் தன்நெஞ்சத்து அழுக்காறு இல்லாத இயல்பு.","பொறாமை இல்லாத குணத்தையே ஒருவன் தனக்கு ஒழுக்கமாகக் கொள்ள வேண்டும்."],["அடக்கம் அமரருள் உய்க்கும் அடங்காமை ஆரிருள் உய்த்து விடும்.","அடக்கம் ஒருவனைத் தேவர் உலகிற்குச் செலுத்தும்; அடங்காமை இருளில் தள்ளிவிடும்."],["காக்க பொருளா அடக்கத்தை ஆக்கம் அதனினூஉங்கு இல்லை உயிர்க்கு.","அடக்கத்தைச் சிறந்த செல்வமாகக் காக்க வேண்டும்; அதைவிட உயர்ந்த ஆக்கம் உயிர்களுக்கு இல்லை."],["யாகாவா ராயினும் நாகாக்க காவாக்கால் சோகாப்பர் சொல்லிழுக்குப் பட்டு.","எதைக் காக்காவிட்டாலும் நாவைக் காக்க வேண்டும்; இல்லையேல் சொல் தவறி துன்பத்தில் வீழ்வர்."],["தீயினாற் சுட்டபுண் உள்ளாறும் ஆறாதே நாவினாற் சுட்ட வடு.","நெருப்பால் சுட்ட புண் ஆறிவிடும்; ஆனால் நாவால் சுட்ட வடு ஒருபோதும் ஆறாது."],["சொல்லுக சொல்லிற் பயனுடைய சொல்லற்க சொல்லிற் பயனிலாச் சொல்.","பயனுள்ள சொற்களையே பேச வேண்டும்; பயனில்லாத சொற்களைப் பேசக் கூடாது."],["வாய்மை எனப்படுவது யாதெனின் யாதொன்றும் தீமை இலாத சொலல்.","வாய்மை என்பது எவருக்கும் எந்தத் தீமையும் தராத சொற்களைச் சொல்வதே."],["உள்ளத்தால் பொய்யாது ஒழுகின் உலகத்தார் உள்ளத்துள் எல்லாம் உளன்.","மனத்தால் பொய் சொல்லாமல் வாழ்பவன், உலகத்தார் எல்லோருடைய உள்ளத்திலும் இடம்பெறுவான்."],["செல்லிடத்துக் காப்பான் சினம்காப்பான் அல்லிடத்துக் காக்கின்என் காவாக்கால் என்?","பலிக்கும் இடத்தில் சினத்தை அடக்குபவனே அடக்குபவன்; பலிக்காத இடத்தில் அடக்கினால் என்ன, அடக்காவிட்டால் என்ன?"],["சினத்தைப் பொருளென்று கொண்டவன் கேடு நிலத்தறைந்தான் கைபிழையா தற்று.","சினத்தைப் பெரிதாகக் கொண்டவன் அழிவது, நிலத்தை அறைந்தவன் கை நோவது போல உறுதி."],["இன்னா செய்தாரை ஒறுத்தல் அவர்நாண நன்னயம் செய்து விடல்.","தீமை செய்தவரைத் தண்டிக்கும் வழி, அவர் வெட்கப்படும்படி அவருக்கு நன்மை செய்துவிடுவதே."],["அறிவினான் ஆகுவ துண்டோ பிறிதின்நோய் தந்நோய்போல் போற்றாக் கடை.","பிறருடைய துன்பத்தைத் தன் துன்பம்போல் காக்காவிட்டால், அறிவால் என்ன பயன்?"],["யாதனின் யாதனின் நீங்கியான் நோதல் அதனின் அதனின் இலன்.","எந்தெந்தப் பொருளின் மீதுள்ள பற்றை ஒருவன் விடுகிறானோ, அவற்றால் வரும் துன்பம் அவனுக்கு இல்லை."],["அவாஎன்ப எல்லா உயிர்க்கும் எஞ்ஞான்றும் தவாஅப் பிறப்பீனும் வித்து.","ஆசையே எல்லா உயிர்க்கும் எப்போதும் தொடர்ந்து பிறப்பைத் தரும் விதை என்பர்."],["நெருநல் உளனொருவன் இன்றில்லை என்னும் பெருமை உடைத்திவ் வுலகு.","நேற்று இருந்தவன் இன்று இல்லை என்னும் நிலையாமையே இந்த உலகின் பெருமை."],["கற்க கசடறக் கற்பவை கற்றபின் நிற்க அதற்குத் தக.","கற்க வேண்டியவற்றைப் பிழையின்றிக் கற்று, கற்றபடி வாழ வேண்டும்."],["எண்ணென்ப ஏனை எழுத்தென்ப இவ்விரண்டும் கண்ணென்ப வாழும் உயிர்க்கு.","எண்ணும் எழுத்தும் வாழ்கின்ற மனிதர்க்கு இரு கண்கள் போன்றவை."],["கண்ணுடையர் என்பவர் கற்றோர் முகத்திரண்டு புண்ணுடையர் கல்லா தவர்.","கற்றவரே உண்மையில் கண்ணுடையவர்; கல்லாதவர் முகத்திலுள்ள இரு கண்களும் புண்களே."],["உவப்பத் தலைக்கூடி உள்ளப் பிரிதல் அனைத்தே புலவர் தொழில்.","கூடும்போது மகிழவும், பிரியும்போது நினைத்து ஏங்கவும் செய்வதே அறிஞரின் இயல்பு."],["தொட்டனைத் தூறும் மணற்கேணி மாந்தர்க்குக் கற்றனைத் தூறும் அறிவு.","மணலில் தோண்டத் தோண்ட நீர் ஊறுவது போல, கற்கக் கற்க அறிவு பெருகும்."],["யாதானும் நாடாமால் ஊராமால் என்னொருவன் சாந்துணையும் கல்லாத வாறு.","எல்லா ஊரும் நாடும் தம் ஊரே என்றிருக்க, ஒருவன் சாகும்வரை கல்லாமல் இருப்பது ஏன்?"],["கேடில் விழுச்செல்வம் கல்வி யொருவற்கு மாடல்ல மற்றை யவை.","ஒருவனுக்கு அழிவற்ற சிறந்த செல்வம் கல்வியே; மற்றவை செல்வம் அல்ல."],["செவிக்குண வில்லாத போழ்து சிறிது வயிற்றுக்கும் ஈயப் படும்.","செவிக்கு உணவாகிய கேள்வி இல்லாதபோதுதான் வயிற்றுக்குச் சிறிது உணவு தர வேண்டும்."],["எப்பொருள் யார்யார்வாய்க் கேட்பினும் அப்பொருள் மெய்ப்பொருள் காண்ப தறிவு.","எந்தப் பொருளை யார் சொல்லக் கேட்டாலும், அதன் உண்மைப் பொருளைக் காண்பதே அறிவு."],["எதிரதாக் காக்கும் அறிவினார்க்கு இல்லை அதிர வருவதோர் நோய்.","வருவதை முன்னே அறிந்து காக்கும் அறிவுடையவர்க்கு, அதிர்ச்சி தரும் துன்பம் வராது."],["அறிவுடையார் எல்லாம் உடையார் அறிவிலார் என்னுடைய ரேனும் இலர்.","அறிவுடையவர் எல்லாம் உடையவர்; அறிவில்லாதவர் எது இருந்தாலும் ஒன்றும் இல்லாதவர்."],["மனத்துளது போலக் காட்டி ஒருவற்கு இனத்துளது ஆகும் அறிவு.","ஒருவனின் அறிவு மனத்தில் உள்ளது போலத் தோன்றினாலும், உண்மையில் அவன் சேர்ந்த இனத்தால் அமைவதே."],["நல்லினத்தின் ஊங்குந் துணையில்லை தீயினத்தின் அல்லற் படுப்பதூஉம் இல்.","நல்ல இனத்தைவிடச் சிறந்த துணை இல்லை; தீய இனத்தைவிட வருத்துவதும் இல்லை."],["சொல்லுக சொல்லைப் பிறிதோர்சொல் அச்சொல்லை வெல்லுஞ்சொல் இன்மை அறிந்து.","ஒரு சொல்லை வெல்லும் மற்றொரு சொல் இல்லை என்பதை அறிந்து, சிந்தித்துச் சொல்ல வேண்டும்."],["முகநக நட்பது நட்பன்று நெஞ்சத் தகநக நட்பது நட்பு.","முகத்தளவில் சிரித்துப் பழகுவது நட்பன்று; உள்ளத்தால் மகிழ்ந்து பழகுவதே நட்பு."],["உடுக்கை இழந்தவன் கைபோல ஆங்கே இடுக்கண் களைவதாம் நட்பு.","ஆடை நழுவும்போது கை உடனே சென்று காப்பது போல, துன்பம் வந்தபோது உடனே உதவுவதே நட்பு."],["நவில்தொறும் நூல்நயம் போலும் பயில்தொறும் பண்புடை யாளர் தொடர்பு.","படிக்கப் படிக்க நூலின் சுவை கூடுவது போல, பழகப் பழக பண்புடையவரின் நட்பு இனிக்கும்."],["அடுத்தது காட்டும் பளிங்குபோல் நெஞ்சம் கடுத்தது காட்டும் முகம்.","பளிங்கு தன் அருகிலுள்ளதைக் காட்டுவது போல, உள்ளத்தில் உள்ளதை முகம் காட்டிவிடும்."],["முயற்சி திருவினை யாக்கும் முயற்றின்மை இன்மை புகுத்தி விடும்.","முயற்சி செல்வத்தைத் தரும்; முயற்சி இல்லாமை வறுமையில் தள்ளிவிடும்."],["தெய்வத்தான் ஆகா தெனினும் முயற்சிதன் மெய்வருத்தக் கூலி தரும்.","விதியால் கைகூடாவிட்டாலும், உடலை வருத்தி முயன்றால் அந்த முயற்சிக்கு உரிய பயன் கிடைக்கும்."],["ஊழையும் உப்பக்கம் காண்பர் உலைவின்றித் தாழாது உஞற்று பவர்.","தளராமல், சோர்வடையாமல் முயல்பவர் விதியையும் வென்று பின்னே தள்ளுவர்."],["மடிமை குடிமைக்கண் தங்கின் தன்னொன்றி அடிமை புகுத்தி விடும்.","சோம்பல் ஒருவனிடம் தங்கினால், அது அவனைப் பிறருக்கு அடிமையாக்கிவிடும்."],["வெள்ளத் தனைய மலர்நீட்டம் மாந்தர்தம் உள்ளத் தனைய துயர்வு.","நீரின் அளவே தாமரைத் தண்டின் நீளம்; மனிதரின் உள்ள உயர்வே அவர் வாழ்வின் உயர்வு."],["உள்ளுவ தெல்லாம் உயர்வுள்ளல் மற்றது தள்ளினும் தள்ளாமை நீர்த்து.","எண்ணுவதெல்லாம் உயர்வாகவே எண்ண வேண்டும்; அது கைகூடாவிட்டாலும் அந்த எண்ணத்தை விடக் கூடாது."],["சுழன்றும் ஏர்ப்பின்ன துலகம் அதனால் உழந்தும் உழவே தலை.","உலகம் பல தொழில் செய்து சுழன்றாலும் உழவரின் பின்னேதான் நிற்கிறது; ஆகவே துன்பமானாலும் உழவே சிறந்தது."],["உழுதுண்டு வாழ்வாரே வாழ்வார் மற்றெல்லாம் தொழுதுண்டு பின்செல் பவர்.","உழுது உண்டு வாழ்பவரே உண்மையாக வாழ்பவர்; மற்றவர் அவரைத் தொழுது உண்டு பின் செல்பவரே."],["இலம்என்று அசைஇ இருப்பாரைக் காணின் நிலம்என்னும் நல்லாள் நகும்.","\"வறியோம்\" என்று சோம்பி இருப்பவரைக் கண்டால், நிலமகள் எள்ளி நகைப்பாள்."],["பிறப்பொக்கும் எல்லா உயிர்க்கும் சிறப்பொவ்வா செய்தொழில் வேற்றுமை யான்.","பிறப்பால் எல்லா உயிரும் ஒன்றே; செய்யும் தொழிலின் வேறுபாட்டால் சிறப்பு வேறுபடும்."],["நயனொடு நன்றி புரிந்த பயனுடையார் பண்புபா ராட்டும் உலகு.","நீதியோடு நன்மை செய்து பயன் தருபவரின் பண்பை உலகம் போற்றும்."],["குற்றம் இலனாய்க் குடிசெய்து வாழ்வானைச் சுற்றமாச் சுற்றும் உலகு.","குற்றம் இல்லாமல் குடும்பத்தைக் காத்து வாழ்பவனை உலகம் தன் உறவாகச் சுற்றி நிற்கும்."],["தோன்றின் புகழொடு தோன்றுக அஃதிலார் தோன்றலின் தோன்றாமை நன்று.","பிறந்தால் புகழுடன் பிறக்க வேண்டும்; அது இல்லாதவர் பிறப்பதைவிடப் பிறவாமையே நல்லது."],["ஊருணி நீர்நிறைந் தற்றே உலகவாம் பேரறி வாளன் திரு.","பேரறிவுடையவனின் செல்வம், ஊரார் எல்லோரும் பருகும் குளத்து நீர் நிறைந்தது போன்றது."],["வறியார்க்கொன்று ஈவதே ஈகை மற்றெல்லாம் குறியெதிர்ப்பை நீரது உடைத்து.","வறியவருக்குக் கொடுப்பதே உண்மையான ஈகை; மற்றவை பயனை எதிர்பார்த்துச் செய்யும் கொடையே."],["அருளென்னும் அன்பீன் குழவி பொருளென்னும் செல்வச் செவிலியால் உண்டு.","அன்பு பெற்றெடுத்த குழந்தையான அருள், பொருள் என்னும் செவிலித்தாயால் வளர்கிறது."]];

const PROV=["அகத்தின் அழகு முகத்தில் தெரியும்.","அகல இருந்தால் நிகள உறவு, கிட்டவந்தால் முட்டப் பகை.","அகல உழுகிறதை விட ஆழ உழு.","அகல் வட்டம் பகல் மழை.","அசைந்து தின்கிறது யானை, அசையாமல் தின்கிறது வீடு.","அச்சமில்லாதவன் அம்பலம் ஏறுவான்.","அச்சாணி இல்லாத தேர் முச்சாணும் ஓடாது.","அஞ்சிலே வளையாதது ஐம்பதிலே வளையுமா?","அடக்கமே பெண்ணுக்கு அழகு.","அடக்கம் உடையார் அறிஞர், அடங்காதவர் கல்லார்.","அடாது செய்தவன் படாது படுவான்.","அடி நாக்கிலே நஞ்சும் நுனி நாக்கில் அமுதமும்.","அடி மேல் அடி அடித்தால் அம்மியும் நகரும்.","அடியாத மாடு படியாது.","அணில் கொம்பிலும், ஆமை கிணற்றிலும்.","அணை கடந்த வெள்ளம் அழுதாலும் வாராது.","அத்திப் பழத்தைப் பிட்டுப்பார்த்தால் அத்தனையும் புழு.","அந்தி மழை அழுதாலும் விடாது.","அப்பன் அருமை மாண்டால் தெரியும்.","அப்பியாச வித்தைக்கு அழிவில்லை.","அரசன் இல்லாத நாடு அச்சில்லாத தேர்.","அரிசி ஆழாக்கானாலும் அடுப்புக் கட்டி மூன்று வேண்டும்.","அருமையற்ற வீட்டில் எருமையும் குடியிருக்காது.","அழுகிற ஆணையும், சிரிக்கிற பெண்ணையும் நம்பக்கூடாது.","அழுத பிள்ளைதான் பால் குடிக்கும்.","அழுதாலும் பிள்ளை அவளே பெற வேண்டும்.","அளவுக்கு மிஞ்சினால் அமிர்தமும் நஞ்சு.","அள்ளிக் கொடுத்தால் சும்மா, அளந்து கொடுத்தால் கடன்.","அறக்கப் பறக்க பாடுபட்டாலும் படுக்கப் பாயில்லை.","அறிந்தறிந்து செய்கிற பாவத்தை அழுதழுது தொலைக்கவேண்டும்.","அறிவுடையாரை அரசனும் விரும்புவான்.","அறுப்புக் காலத்தில் எலிக்கு ஐந்து பெண்சாதி.","அன்பு இருந்தால் ஆகாததும் ஆகும்.","அன்று எழுதியவன் அழித்து எழுதுவானா?","அன்று குடிக்கத் தண்ணீர் இல்லை ஆனைமேல் அம்பாரி வேணுமாம்.","அன்னைக்கு உதவாதவன் யாருக்கும் ஆகான்.","அன்னம் இட்டவர் வீட்டில் கன்னம் இடலாமா?","ஆக்கப் பொறுத்தவர் ஆறப் பொறுப்பதில்லை.","ஆடையில்லாதவன் அரை மனிதன்.","ஆத்திரக்காரனுக்குப் புத்தி மட்டு.","ஆரால் கேடு, வாயால் கேடு.","ஆரியக் கூத்தாடினாலும் காரியத்தில் கண்ணாயிரு.","ஆலும் வேலும் பல்லுக்குறுதி, நாலும் இரண்டும் சொல்லுக்குறுதி.","ஆழமறியாமல் காலை இடாதே.","ஆவும் தென்னையும் ஐந்து வருடத்தில் பலம் தரும்.","ஆள் கொஞ்சமானாலும் ஆயுதம் மிடுக்கு.","ஆறிலுஞ் சாவு நூறிலுஞ் சாவு.","ஆறின கஞ்சி பழங் கஞ்சி.","ஆறு கடக்கிறவரையில் அண்ணன் தம்பி, ஆறு கடந்தால் நீ யார் நான் யார்?","ஆற்றிலே போட்டாலும் அளந்து போடு.","ஆற்றில் ஒரு கால் சேற்றில் ஒரு கால்.","ஆனைக்கு ஒரு காலம் பூனைக்கு ஒரு காலம்.","ஆனைக்கும் அடிசறுக்கும்.","ஆனை வரும் பின்னே, மணி ஓசை வரும் முன்னே.","இக்கரை மாட்டுக்கு அக்கரை பச்சை.","இங்கே தலை காட்டுகிறான், அங்கே வால் காட்டுகிறான்.","இஞ்சி இலாபம் மஞ்சளில்.","இடம் கொடுத்தால் மடம் பிடுங்குவான்.","இட்டுக் கெட்டார் எங்குமே இல்லை.","இமைக்குற்றம் கண்ணுக்குத் தெரியாது.","இரக்கப் போனாலும் சிறக்கப் போ.","இரண்டு ஓடத்தில் கால் வைக்காதே.","இரவற் சீலையை நம்பி இடுப்புக் கந்தையை எறியாதே.","இரும்படிக்கும் இடத்தில் ஈக்கென்ன வேலை?","இருவர் நட்பு ஒருவர் பொறை.","இளங்கன்று பயமறியாது.","இளமையில் கல்.","இளமையிற் கல்வி கல் மேல் எழுத்து.","இளமையில் சோம்பல் முதுமையில் வருத்தம்.","இறுகினால் களி, இளகினால் கூழ்.","இறைக்க ஊறும் மணற்கேணி, ஈயப் பெருகும் பெருஞ்செல்வம்.","இறைக்கிற ஊற்றே சுரக்கும்.","இனம் இனத்தோடே, வெள்ளாடு தன்னோடே.","இன்றைக்கு இலை அறுத்தவன் நாளைக்கு குலை அறுப்பான்.","ஈக்கு விடம் தலையில், தேளுக்கு விடம் கொடுக்கில்.","ஈட்டி எட்டு முழம் பாயும் பணம் பாதாளம் மட்டும் பாயும்.","ஈயார் தேட்டைத் தீயார் கொள்வர்.","ஈர நாவிற்கு எலும்பில்லை.","உடல் உள்ள வரையில் கடல் கொள்ளாத கவலை.","உடம்பு போனால் போகிறது கை வந்தால் போதும்.","உடைமையும் வறுமையும் ஒரு வழி நில்லா.","உண்ட உடம்பிற்கு உறுதி, உழுத புலத்தில் நெல்லு.","உண்ட வீட்டுக்கு ரெண்டகம் நினைக்காதே.","உண்டிக்கு அழகு விருந்தோடு உண்டல்.","உண்டு கொழுத்தால் நண்டு வலையில் இராது.","உண்ணாச் சொத்து மண்ணாய்ப் போகும்.","உதட்டில் உறவு உள்ளத்தில் பகை.","உப்பிட்டவரை உள்ளளவும் நினை.","உயர உயரப் பறந்தாலும் ஊர்க்குருவி பருந்தாகுமா?","உயிர் காப்பான் தோழன்.","உரலில் அகப்பட்டது உலக்கைக்கு தப்புமா?","உழுகிற நாளில் ஊருக்குப் போனால், அறுக்கிற நாளில் ஆள் தேவையில்லை.","உழுதவன் கணக்குப் பார்த்தால் உழக்கேனும் மிஞ்சாது.","உளவு இல்லாமல் களவு இல்லை.","உள்ளது போகாது இல்லது வாராது.","உறியிலே வெண்ணெய் இருக்க நெய்க்கலைவானேன்?","உறவு போகாமல் கெட்டது கடன் கேட்காமல் கெட்டது.","ஊசியைக் காந்தம் இழுக்கும் உத்தமனைச் சிநேகம் இழுக்கும்.","ஊணுக்கு முந்துவான் வேலைக்குப் பிந்துவான்.","ஊர் உண்டு பிச்சைக்கு, குளம் உண்டு தண்ணீருக்கு.","ஊர் வாயை மூட உலைமூடி இல்லை.","ஊர் இரண்டு பட்டால் கூத்தாடிக்குக் கொண்டாட்டம்.","ஊருடன் ஒட்டி வாழ்.","ஊருடன் பகைக்கின் வேருடன் கெடும்.","ஊழி பெயரினும் ஊக்கமது கைவிடேல்.","எங்கே புகையுண்டோ அங்கே நெருப்பு உண்டு.","எச்சிற் கையால் காக்கை ஓட்டாதவன் பிச்சை கொடுப்பானா?","எடுக்கிறது பிச்சை ஏறுகிறது பல்லாக்கு.","எட்டாக் கனிக்குக் கொட்டாவி விடாதே.","எட்டி பழுத்தென்ன, ஈயார் வாழ்த்தென்ன?","எண்சாண் உடம்பிற்கு சிரசே பிரதானம்.","எண்ணிச் செய்கிறவன் கெட்டி, எண்ணாமல் செய்கிறவன் மட்டி.","எண்ணும் எழுத்தும் கண்ணெனத் தகும்.","எதை அடக்காவிட்டாலும் நாக்கை அடக்கவேண்டும்.","எத்தனை புடம் போட்டாலும் இரும்பு பசும்பொன் ஆகுமா?","எய்தவன் இருக்க அம்பை நோவானேன்?","எரிகிற விளக்கானாலும் தூண்டுகோல் வேண்டும்.","எருமை வாங்கும் முன்னே நெய் விலை கூறாதே.","எலி அழுதால் பூனை விடுமா?","எலி வளையானாலும் தனி வளை வேண்டும்.","எல்லோரும் பல்லக்கு ஏறினால் பல்லக்கைத் தூக்குகிறவர் யார்?","எழுத்தறிவித்தவன் இறைவன் ஆவான்.","எளியாரை வலியார் அடித்தால் வலியாரை தெய்வம் அடிக்கும்.","எறும்பு ஊர கல்லுந் தேயும்.","ஏட்டுச் சுரைக்காய் கறிக்கு உதவாது.","ஏரி நிறைந்தால் கரை கசியும்.","ஏழை அழுத கண்ணீர் கூரிய வாளை ஒக்கும்.","ஏழைபேச்சு அம்பலம் ஏறாது.","ஐந்திலே வளையாதது, ஐம்பதிலே வளையுமா?","ஓதாதார்க்கு இல்லை உணர்வொடு ஒழுக்கம்.","ஒரு காசு பேணின் இரு காசு தேறும்.","ஒரு குடம் பாலுக்கு ஒரு துளி விஷம்.","ஒரு கை தட்டினால் ஓசை எழும்புமா?","ஒரு நன்றி செய்தவரை உள்ள அளவும் நினை.","ஒரு பானைச் சோற்றுக்கு ஒரு சோறு பதம்.","ஒரு பொய்யை மறைக்க ஒன்பது பொய்.","ஒருவர் அறிந்தால் இரகசியம், இருவர் அறிந்தால் அம்பலம்.","ஒழுக்கம் உயர்குலத்தின் நன்று.","ஒன்று பட்டால் உண்டு வாழ்வு.","ஓசை பெறும் வெண்கலம் ஓசை பெறா மட்கலம்.","ஓட்டைக் கப்பலுக்கு ஒன்பது மாலுமி.","ஓர் ஊருக்கு ஒரு வழியா? ஒன்பது வழி.","ஒளவை சொல்லுக்கு அச்சம் இல்லை.","கங்கையில் மூழ்கினாலும் காக்கை அன்னம் ஆகுமா?","கசடறக் கல்லார்க்கு இசை உறல் இல்லை.","கடலுக்குக் கரை போடுவார் உண்டா?","கடலைத் தாண்ட ஆசையுண்டு கால்வாயைத் தாண்டக் கால் இல்லை.","கடல் மீனுக்கு நீச்சுப் பழக்க வேண்டுமா?","கடவுளை நம்பினோர் கைவிடப் படார்.","கடன் வாங்கியும் பட்டினி, கல்யாணம் பண்ணியும் சந்நியாசி.","கடித்த சொல்லினும் கனிந்த சொல்லே நன்மை.","கடுகத்தனை நெருப்பானாலும் போரைக் கொளுத்திவிடும்.","கடுகு சிறுத்தாலும் காரம் போகுமா?","கடுஞ் சொல் தயவைக் கெடுக்கும்.","கணக்கைப் பார்த்தால் பிணக்கு வரும்.","கண் கண்டது கை செய்யும்.","கண் கெட்ட பின்னர் சூரிய நமஸ்காரம்.","கண்டதே காட்சி கொண்டதே கோலம்.","கண்ணிலே குத்தின விரலைக் கண்டிப்பார் உண்டோ?","கரணம் தப்பினால் மரணம்.","கரும்பு கசக்கிறது வாய்க் குற்றம்.","கரும்பு ருசி என்று வேரோடு பிடுங்கலாமா?","கரைப்பார் கரைத்தால் கல்லும் கரையும்.","கல்லாதவரே கண்ணில்லாதவர்.","கல்லாதார் செல்வத்திலும் கற்றார் வறுமை நலம்.","கல்வி அழகே அழகு.","கல்வி இல்லாச் செல்வம் கற்பில்லா அழகு.","கல்விக்கு அழகு கசடர மொழிதல்.","கவலை உடையோர்க்குக் கண்ணுறக்கம் வராது.","கழுதைக்குத் தெரியுமா கற்பூர வாசனை?","களை பிடுங்காப் பயிர் காற்பயிர்.","கள்ள மனம் துள்ளும்.","கள்ளைக் குடித்தால் உள்ளதைச் சொல்லுவான்.","கற்றது கைம்மண்ணளவு கல்லாதது உலகளவு.","கற்றோர்க்குச் சென்ற இடமெல்லாம் சிறப்பு.","கனவில் கண்ட பணம் செலவிற்கு உதவுமா?","கனிந்த பழம் தானே விழும்.","கற்கையில் கல்வி கசப்பு, கற்றபின் அதுவே இனிப்பு.","கற்பில்லாத அழகு, வாசனை இல்லாத பூ.","காசுக்கு ஒரு குதிரையும் வேண்டும், காற்றைப் போலப் பறக்கவும் வேண்டும்.","காணி ஆசை கோடி கேடு.","காமாலைக் கண்ணுக்குக் கண்டதெல்லாம் மஞ்சள் நிறம்.","காய்த்த மரம் கல் அடிபடும்.","காரியமாகும் வரையில் கழுதையையும் காலைப்பிடி.","காலம் செய்கிறது ஞாலம் செய்யாது.","காலம் போம் வார்த்தை நிற்கும், கப்பல் போம் துறை நிற்கும்.","காலுக்குதக்க செருப்பும், கூலிக்குத் தக்க உழைப்பும்.","காவடிப் பாரம் சுமக்கிறவனுக்குத் தெரியும்.","காற்றில்லாமல் தூசி பறக்குமா?","காற்று உள்ளபோதே தூற்றிக்கொள்.","காற்றுக்கு எதிர்லே துப்பினால் முகத்தில் விழும்.","கிட்டாதாயின் வெட்டென மற.","கிணற்றுத் தவளைக்கு நாட்டு வளப்பம் ஏன்?","கீர்த்தியால் பசி தீருமா?","குங்குமம் சுமந்த கழுதை மணம் அறியுமா?","குடல் காய்ந்தால் குதிரையும் வைக்கோல் தின்னும்.","குடி, சூது, விபசாரம் குடியைக் கெடுக்கும்.","குட்டுப் பட்டாலும் மோதிரக்கையால் குட்டுப்படவேண்டும்.","குணம் இல்லா வித்தை எல்லாம் அவித்தை.","குணம் பெரிதேயன்றிக் குலம் பெரியதன்று.","குந்தி இருந்து தின்றால் குன்றும் மாளும்.","குப்பை உயரும் கோபுரம் தாழும்.","குரைக்கிற நாய் வேட்டை பிடிக்குமா?","குரைக்கிற நாய் கடிக்காது.","குறைகுடம் தளும்பும், நிறைகுடம் தளும்பாது.","குற்றமுள்ள நெஞ்சு குறுகுறுக்கும்.","குற்றம் பார்க்கின் சுற்றம் இல்லை.","குப்பையிற் கிடந்தாலும் குன்றிமணி நிறம் போகுமா?","கும்பிடு கொடுத்துக் கும்பிடு வாங்கு.","குரங்கின் கைப் பூமாலை.","குனியக் குனியக் குட்டுவான், குனிந்தவன் நிமிர்ந்தால் குட்டினவன் ஓடுவான்.","கூடி வாழ்ந்தால் கோடி நன்மை.","கூலியைக் குறைக்காதே வேலையைக் கெடுக்காதே.","கூழானாலும் குளித்துக் குடி; கந்தையானாலும் கசக்கிக் கட்டு.","கெடுக்கினும் கல்வி கேடுபடாது.","கெடுவான் கேடு நினைப்பான்.","கெட்டாலும் கெட்டி கெட்டியே, கிழிந்தாலும் பட்டு பட்டே.","கெட்டிக்காரன் புளுகு எட்டு நாளையில் தெரியும்.","கெட்டும் பட்டணம் சேர்.","கேடு வரும் பின்னே, மதி கெட்டுவரும் முன்னே.","கேட்டதெல்லாம் நம்பாதே? நம்பியதெல்லாம் சொல்லாதே?","கைக்கு எட்டினது வாய்க்கு எட்டவில்லை.","கைப்புண்ணுக்குக் கண்ணாடி வேண்டுமா?","கைப்பொருள் தன்னின் மெய்ப்பொருள் கல்வி.","கையாளாத ஆயுதம் துருப்பிடிக்கும்.","கையில் உண்டானால் காத்திருப்பார் ஆயிரம் பேர்.","கொடுங்கோல் அரசு நெடுங்காலம் நில்லாது.","கொலைக்கு அஞ்சாதவன் பழிக்கு அஞ்சான்.","கொல்லன் தெருவில் ஊசி விலைபோமா?","கொற்றவன் தன்னிலும் கற்றவன் மிக்கோன்.","கோள் சொல்பவனைக் கொடுந்தேள் என நினை.","கோத்திரமறிந்து பெண்ணைக்கொடு, பாத்திரமறிந்து பிச்சையிடு.","கோபம் சண்டாளம்.","கோயிற் பூனை தேவர்க்கு அஞ்சுமா?","கோடி கொடுப்பினும் குடில் பிறந்தார் தம்மோடு கூடுவதே கோடி பெறும்.","சட்டியில் இருந்தால் தான் அகப்பையில் வரும்.","சத்தியமே வெல்லும், அசத்தியம் கொல்லும்.","சருகைக் கண்டு தணலஞ்சுமா?","சாது மிரண்டால் காடு கொள்ளாது.","சாண் ஏற முழம் சறுக்கிறது.","சித்திரமும் கைப்பழக்கம்.","சிறு துரும்பும் பல் குத்த உதவும்.","சின்ன மீனைப் போட்டுப் பெரிய மீனைப் பிடி.","சுக துக்கம் சுழல் சக்கரம்.","சுடர் விளக்காயினும் தூண்டுகோல் ஒன்று வேண்டும்.","சுட்ட சட்டி அறியுமா சுவை?","சுடினும் செம்பொன் தன்னொலி கெடாது.","சுத்தம் சோறு போடும்.","சுத்த வீரனுக்கு உயிர் துரும்பு.","சும்மா வந்த மாட்டை பல்லைப் பிடித்துப் பாராதே.","சுயபுத்தி போனாலும் சொற்புத்தி வேண்டாமா?","சுவரை வைத்துதான் சித்திரம் வரையவேண்டும்.","சூடு கண்ட பூனை அடுப்பங் கரையிற் சேராது.","செய்வன திருந்தச் செய்.","செருப்பின் அருமை வெயிலில் தெரியும், நெருப்பின் அருமை குளிரில் தெரியும்.","செருப்புக்காகக் காலைத் தறிக்கிறதா?","சென்ற இடம் எல்லாம் சிறப்பே கல்வி.","சேற்றிலே செந்தாமரை போல.","சொல் அம்போ வில் அம்போ?","சொல்லாமற் செய்வார் நல்லோர் சொல்லியுஞ் செய்யார் கசடர்.","சொல்வல்லவனை வெல்லல் அரிது.","சொன்னதைச் சொல்லும் கிளிப்பிள்ளை.","சோம்பலே சோறு இன்மைக்குப் பிதா.","சோம்பித் திரியேல்.","தங்கம் தரையிலே தவிடு பானையிலே.","தஞ்சம் என்று வந்தவனை வஞ்சித்தல் ஆகாது.","தடி எடுத்தவன் தண்டல்காரனா?","தணிந்த வில்லுத்தான் தைக்கும்.","தண்ணீரையும் தாயையும் பழிக்காதே.","தந்தை எவ்வழி புதல்வன் அவ்வழி.","தந்தை தாய் பேண்.","தம்பி உடையான் படைக்கு அஞ்சான்.","தருமம் தலைகாக்கும்.","தலை இடியும் காய்ச்சலும் தனக்கு வந்தால் தெரியும்.","தவளை தன் வாயாற் கெடும்.","தனி மரம் தோப்பாகாது.","தன் கையே தனக்குதவி.","தன் வினை தன்னைச் சுடும் ஓட்டப்பம் வீட்டைச் சுடும்.","தாயிற் சிறந்ததொரு கோவிலுமில்லை, தந்தை சொல் மிக்க மந்திரமில்லை.","தாயும் பிள்ளையுமானாலும், வாயும் வயிறும் வேறு.","தாய் எட்டடி பாய்ந்தால், குட்டி பதினாறடி பாயும்.","தினை விதைத்தவன் தினை அறுப்பான், வினை விதைத்தவன் வினை அறுப்பான்.","துள்ளுகிற மாடு பொதி சுமக்காது.","தூரத்துப் பச்சை கண்ணுக்குக் குளிர்ச்சி.","தொட்டில் பழக்கம் சுடுகாடு மட்டும்.","நடக்க அறியாதவனுக்கு நடுவீதி காத வழி.","நத்தையின் வயிற்றிலும் முத்துப் பிறக்கும்.","நயத்திலாகிறது பயத்திலாகாது.","நரிக்கு இடங்கொடுத்தால் கிடைக்கு இரண்டு ஆடு கேட்கும்.","நல்லது செய்து நடுவழியே போனால், பொல்லாதது போகிற வழியே போகிறது.","நல்லவன் என்று பெயர் எடுக்க நெடுநாள் செல்லும்.","நல்லார் பொல்லாரை நடத்தையால் அறியலாம்.","நல்ல மாட்டிற்கு ஒரு சூடு நல்ல மனிதனுக்கு ஒரு வார்த்தை.","நன்மை கடைப்பிடி.","நா அசைய நாடு அசையும்.","நாக்கிலே இருக்கிறது நன்மையும் தீமையும்.","நாம் ஒன்று நினைக்க, தெய்வம் ஒன்று நினைக்கும்.","நாய் வாலை நிமிர்த்த முடியாது.","நாலாறு கூடினால் பாலாறு.","நான் பிடித்த முயலுக்கு மூன்றே கால்கள்.","நித்தம் போனால் முத்தம் சலிக்கும்.","நிழலின் அருமை வெயிலில் தெரியும்.","நின்ற வரையில் நெடுஞ் சுவர், விழுந்த அன்று குட்டிச்சுவர்.","நிறை குடம் நீர் தளும்பாது, குறைகுடம் கூத்தாடும்.","நீந்த மாட்டாதவனை ஆறு கொண்டு போம்.","நீர் ஆழம் கண்டாலும் நெஞ்சு ஆழம் காண முடியாது.","நீர் மேல் எழுத்து போல்.","நுணலும் தன் வாயால் கெடும்.","நுண்ணிய கருமமும் எண்ணித் துணிக.","நுனிக்கொம்பில் ஏறி அடிக்கொம்பு வெட்டுவார்களா?","நூல் கற்றவனே மேலவன்.","நெருப்பில்லாமல் புகையாது.","நெல்லுக்குப் பாய்கிற தண்ணீர் புல்லுக்கும் பாயும்.","நைடதம் புலவர்க்கு ஒளடதம்.","நொறுங்கத் தின்றால் நூறு வயது.","நோயற்ற வாழ்வே குறைவற்ற செல்வம்.","நோய்க்கு இடம் கொடேல்.","பகைவர் உறவு புகை எழு நெருப்பு.","பசி வந்திடில் பத்தும் பறந்துபோம்.","பசியுள்ளவன் ருசி அறியான்.","பஞ்சும் நெருப்பும் ஒன்றாய்க் கிடக்குமோ?","படிக்கிறது திருவாய் மொழி இடிக்கிறது பெருமாள் கோயில்.","படைக்கும் ஒருவன் கொடைக்கும் ஒருவன்.","பட்ட காலிலே படும் கெட்ட குடியே கெடும்.","பணம் பத்தும் செய்யும்.","பணம் உண்டானால் மணம் உண்டு.","பண்ணிய பயிரிலே புண்ணியம் தெரியும்.","பதறாத காரியம் சிதறாது.","பந்திக்கு முந்து படைக்குப் பிந்து.","பருவத்தே பயிர் செய்.","பல துளி பெருவெள்ளம்.","பலநாளைத் திருடன் ஒரு நாளைக்கு அகப்படுவான்.","பல மரம் கண்ட தச்சன் ஒரு மரமும் வெட்டமாட்டான்.","பல்லார் முனியப் பயனில சொல்லுவான் எல்லாரும் எள்ளப்படும்.","பழகப் பழகப் பாலும் புளிக்கும்.","பழுத்த ஓலையைப் பார்த்துக் குருத்தோலை சிரிக்கிறதாம்.","பனங்காட்டு நரி சலசலப்புக்கு அஞ்சுமா?","பன்றி பல குட்டி, சிங்கம் ஒரு குட்டி.","பாம்புக்குப் பால் வார்த்தாலும் நஞ்சைத்தான் கக்கும்.","பார்த்தால் பூனை பாய்ந்தால் புலி.","புத்திமான் பலவான்.","புலிக்குப் பிறந்தது பூனையாய்ப் போகுமா?","புலி பதுங்குவது பாய்ச்சலுக்கு அடையாளம்.","பூமியைப்போலப் பொறுமை வேண்டும்.","பூவோடு சேர்ந்த நாரும் மணம் பெறும்.","பெருமையும் சிறுமையும் வாயால் வரும்.","பெற்ற மனம் பித்து, பிள்ளை மனம் கல்லு.","பேசாதிருந்தால் பிழையொன்றுமில்லை.","பேராசை பெருநட்டம்.","பொய் சொல்லி வாழ்ந்தவனுமில்லை, மெய் சொல்லிக் கெட்டவனுமில்லை.","பொறுத்தார் பூமி ஆள்வார், பொங்கினார் காடாள்வார்.","பொறுமை கடலினும் பெரிது.","பொற்கலம் ஒலிக்காது, வெண்கலம் ஒலிக்கும்.","பொன் ஆபரணத்தைப் பார்க்கிலும் புகழ் ஆபரணமே பெரிது.","போதும் என்ற மனமே பொன் செய்யும் மருந்து.","போனதை நினைக்கிறவன் புத்தி கெட்டவன்.","மடியிலே கனமிருந்தால்தான் வழியிலே பயம்.","மட்டான போசனம் மனதிற்கு மகிழ்ச்சி.","மண் குதிரையை நம்பி ஆற்றில் இறங்கலாமா?","மந்திரிக்கு அழகு வரும்பொருள் உரைத்தல்.","மரம் வைத்தவன் தண்ணீர் வார்ப்பான்.","மருந்தே ஆயினும் விருந்தோடு உண்.","மலையைத் துளைக்கச் சிற்றுளி போதாதா?","மல்லாந்து உமிழ்ந்தால் மார்மேல் விழும்.","மனம் உண்டானால் மார்க்கம் உண்டு.","மனம் போல வாழ்வு.","மன்னன் எப்படியோ, மன்னுயிர் அப்படி.","மாடு கெட்டால் தேடலாம், மனிதர் கெட்டால் தேடலாமா?","மாதா ஊட்டாத சோறு, மாங்காய் ஊட்டும்.","மானம் பெரிதோ? உயிர் பெரிதோ?","மிஞ்சியது கொண்டு மேற்கே போகுதல் ஆகாது.","மின்னுவது எல்லாம் பொன்னல்ல.","மிதித்தாரை கடியாத பாம்பு உண்டோ?","மீதூண் விரும்பேல்.","முகத்துக்கு முகம் கண்ணாடி.","முக்காலும் காகம் முழுகிக் குளித்தாலும் கொக்காகுமா?","முடவன் கொம்புத் தேனுக்கு ஆசைப் படலாமா?","முதல் கோணல் முற்றுங் கோணல்.","முத்தால் நத்தைப் பெருமைப்படும், மூடர் எத்தாலும் பெருமை படார்.","முள்ளை முள்ளால் எடு.","முற்பகல் செய்யின் பிற்பகல் விளையும்.","முன் ஏர் போன வழிப் பின் ஏர்.","முன் வைத்த காலைப் பின் வைக்கலாமா?","மூத்தோர் சொல் வார்த்தை அமுதம்.","மெல்லப் பாயும் தண்ணீர் கல்லையும் குழியாக்கும்.","மொழி தப்பினவன் வழி தப்பினவன்.","மோகம் முப்பது நாள், ஆசை அறுபது நாள்.","யானை இருந்தாலும் ஆயிரம் பொன், இறந்தாலும் ஆயிரம் பொன்.","யானைக்கும் அடி சறுக்கும்.","வஞ்சகம் வாழ்வைக் கெடுக்கும்.","வட்டி ஆசை முதலுக்கு கேடு.","வரவுக்குத் தக்கபடி செலவை வரையறு.","வருந்தினால் வாராதது இல்லை.","வருமுன் காப்பதறிவு.","வல்லவனுக்கு புல்லும் ஆயுதம்.","வல்லவனுக்கு வல்லவன் வையகத்தில் உண்டு.","வளவனாயினும் அளவறிந் தளித்துண்.","வாயுள்ள பிள்ளை பிழைக்கும்.","வாழ்கிறதும் கெடுகிறதும் வாயினால்தான்.","வாழ்வும் தாழ்வும் சில காலம்.","வாழு, வாழ விடு.","விண் பொய்த்தால் மண் பொய்க்கும்.","விதி எப்படியோ மதி அப்படி.","வியாதிக்கு மருந்துண்டு, விதிக்கு மருந்துண்டா?","விளையாட்டாய் இருந்தது வினையாய் முடிந்தது.","விளையும் பயிர் முளையிலே தெரியும்.","வீட்டில் எலி வெளியில் புலி.","வெளுத்ததெல்லாம் பாலல்ல.","வெள்ளம் வரும் முன் அணை கட்ட வேண்டும்."];

const RIDDLE=[["வகை வகையாய் தெரியும் வண்ணப்படம், கண்மூடிக் காணும் காட்சிப்படம் – அது என்ன?","கனவு"],["மென்மையான உடம்புக்காரன், பாரம் சுமக்கும் கெட்டிக்காரன் – அது என்ன?","நத்தை"],["மூன்றுகால் குள்ள அக்கா, பாரம் தாங்கி, நெருப்பை சுமந்து சோறு சமைப்பாள் – அவள் யார்?","அடுப்பு"],["பட்டனைத் தட்டினால் சட்டென விரியும் – அது என்ன?","குடை"],["நீரிலும், நிலத்திலும் வாழ்வான், பாறைக்குள்ளும் பதுங்கி வாழ்வான் – அவன் யார்?","தவளை"],["கையளவு உடம்புக்காரன், காவலுக்கு கெட்டிக்காரன் – அவன் யார்?","பூட்டு"],["மேகத்தின் பிள்ளை அது, தாகத்தின் நண்பன் – அது என்ன?","மழை"],["முற்றத்தில் நடக்கும் மூலையில் படுப்பான் – அவன் யார்?","துடைப்பம்"],["முன்னும் பின்னும் போவான், ஒற்றைக்காலிலே நிற்பான் – யார் அவன்?","கதவு"],["மேல் பலகை, கீழ் பலகை நடுவில் நெளி பாம்பு – அது என்ன?","நாக்கு"],["மேலே பூ பூக்கும், கீழே காய் காய்க்கும் – அது என்ன?","வேர்க்கடலை"],["இருட்டில் கண் சிமிட்டும் ஆனால் நட்சத்திரமல்ல – அது என்ன?","மின்மினிப் பூச்சி"],["ஒற்றைக்கால் சுப்பனுக்கு தலைக்கனம் அதிகம் – அவன் யார்?","பம்பரம்"],["வெளுத்த அழகி மஞ்சள் புடவை கட்டியிருக்கிறாள் – அவள் யார்?","வாழைப்பழம்"],["ஒட்டியிருக்கிறார்கள் எதிராளிகள், அவர்கள் ஒன்று சேர்ந்தால் மற்றவர்களை பிரிக்கிறார்கள் – அது என்ன?","கத்தரிக்கோல்"],["ஆளுக்கு துணை வருவான் ஆனால் அவன் பேச மாட்டான் – அவன் யார்?","நிழல்"],["உணவை கையில் எடுப்பான் ஆனால் உண்ண மாட்டான் – அவன் யார்?","அகப்பை"],["அரங்கினில் ஆடாதவள், கிளைகளில் அரங்கேற்றம் நடத்துவாள் – அவள் யார்?","தென்றல்"],["தொடப் பார்த்தேன் எட்டிச் சென்றது, பறந்து பார்த்தேன் விரிந்து சென்றது – அது என்ன?","வானம்"],["உலக உயிர்களுக்கெல்லாம் ஒரே உற்சாக பானம் – அது என்ன?","தண்ணீர்"],["கீறினால் சோறுதரும், நீர் ஊற்றினால் சேறு வரும் – அது என்ன?","நிலம்"],["விரிந்த வயல் வெளியில் வதைத்த நெல் மணிகள் – அது என்ன?","நட்சத்திரம்"],["மூலையில் முடங்கிக் கிடப்பான், மூலைமுடுக்கெல்லாம் சுத்தம் செய்வான் – அவன் யார்?","துடைப்பம்"],["இனிப்புப் பொட்டலத்துக்கு இரண்டாயிரம் பேர் காவல் – அது என்ன?","தேன்கூடு"],["கையில்லாமல் நீந்தி, கடல் கடப்பான் – அவன் யார்?","கப்பல்"],["எண்ணத்தை விதைத்து, வண்ணமாய் அறுவடை செய்வது – அது என்ன?","ஓவியம்"],["அவனுக்கு காவலுக்கு ஒரு வீடு, வாழ்வதற்கு ஒரு வீடு – அவன் யார்?","ஆமை"],["ஆரவாரம் இல்லாமல் அணிவகுப்பு, ஓயாது அவர்கள் உழைப்பு – யார் அவர்கள்?","எறும்புக் கூட்டம்"],["கோழிபோல் உருவம், குதிரைபோல் ஓட்டம் – அது என்ன?","நெருப்புக் கோழி"],["உயரப் பறக்கும், ஆனால் ஊரைச் சுற்றிக் கொண்டு பறக்காது – அது என்ன?","கொடி"],["கண்ணே இல்லாதவன், கண் இழந்தோருக்கு வழிகாட்டுவான் – அவன் யார்?","கைத்தடி"],["உதை வாங்கி, உதை வாங்கி ஊருக்கு சேதி சொல்வான் – அவன் யார்?","தண்டோரா"],["கருப்பன் தண்ணீரில் குளித்து வெள்ளையனாவான், வெள்ளையன் பிறகு விருந்தாவான் – அவன் யார்?","உளுத்தம் பருப்பு"],["உருவம் இல்லாத ஒருவன், உலகெங்கும் உலவித் திரிவான் – அவன் யார்?","காற்று"],["அடித்தாலும், உதைத்தாலும் அவன் அழ மாட்டான் – அவன் யார்?","பந்து"],["நனைந்தாலும் நடுங்கமாட்டான் – அவன் யார்?","குடை"],["அனலில் பிறப்பான், ஆகாயத்தில் பறப்பான் – அவன் யார்?","புகை"],["வயிற்றில் விரல் சுமப்பான், தலையில் கல் சுமப்பான் – அவன் யார்?","மோதிரம்"],["எட்டுக்கால் ஊன்றி இடமும், வலமுமாக வருவான் – அவன் யார்?","நண்டு"],["ஓடையில் நிற்கும் ஒற்றைக்காலனுக்கு ஒரே குறி உணவு – அவன் யார்?","கொக்கு"],["ஒற்றைக்கால் பந்தலில் ஊரெல்லாம் தங்கலாம் – அது என்ன?","ஆலமரம்"],["முரட்டு மனிதனுக்கு முப்பத்திரண்டு பேர் காவல் – அது என்ன?","நாக்கு"],["நடந்தால் நடக்கும், நின்றால் நிற்கும் – அது என்ன?","நிழல்"],["உயிரற்ற பறவை, ஊர் ஊராய் பறக்கும் – அது என்ன?","விமானம்"],["விறகெரியத் துணையாகும், விளக்கெரியப் பகையாகும் – அது என்ன?","காற்று"],["நம்மைப்போல் இருக்கும், நாம் இறந்தாலும் இறக்காது – அது என்ன?","புகைப்படம்"],["தலையில் வைக்க முடியாத பூ, சமையலுக்கு உதவும் பூ – அது என்ன?","வாழைப்பூ"],["தோகைபோல உடம்புக் காரி, துப்புரவு தொழிலுக்கு கெட்டிக்காரி – அவள் யார்?","துடைப்பம்"],["ஆயிரம் அறைகள் அரண்மனையில், ராணியின் ஆட்சி – அது என்ன?","தேன்கூடு"],["நூல் நூற்கும் ராட்டை அல்ல, வலை பின்னும் மீன் பிடிக்க அல்ல – அது என்ன?","சிலந்திப் பூச்சி"],["நோயின்றி நாளும் மெலிவாள், கோள் சொல்லி நாளும் கழிவாள் – அவள் யார்?","நாட்காட்டியின் தாள்"],["மழைக்காலம் வந்தாலே மகராசி சங்கீதம் தான் – அவள் யார்?","தவளை"],["அரைசாண் மனிதனுக்கு வயிறு நிறைய முட்டை – அவன் யார்?","வெண்டைக்காய்"],["சிவப்பு பைக்குள் சில்லறைகள் – அது என்ன?","மிளகாய்"],["உலகமெங்கும் சுற்றும் அவனை ஒருவரும் கண்டதில்லை – அவன் யார்?","காற்று"],["அக்கா தங்கை உறவுண்டு, அருகருகே வீடு உண்டு. கிட்டக்கிட்ட வந்தாலும் தொட்டுக் கொள்ள மாட்டார்கள் – அவர்கள் யார்?","கண்கள்"],["வந்தால் கொடுக்கும், வராவிட்டால் கெடுக்கும் – அது என்ன?","மழை"],["வயிறு முட்ட சாப்பிட்டால்தான் நிமிர்ந்து நிற்பான் – அவன் யார்?","பலூன்"],["உழைக்க உழைக்க உடலெல்லாம் தோன்றும் – அது என்ன?","வியர்வை"],["வாலிலே எண்ணெய், தலையிலே கொள்ளி – அது என்ன?","விளக்குத் திரி"],["பந்தலைச் சுற்றி பாம்பு தொங்குது – அது என்ன?","புடலங்காய்"],["ஊளையிட்டுக் கொண்டே ஊரைச் சுமக்கும் – அது என்ன?","புகைவண்டி"],["கடல் நீரில் மறைந்திருக்கும் கல் – அது என்ன கல்?","உப்புக்கல்"],["நிறைவேறாத ஆசைகளை நித்திரையில் பெறலாம் – அது என்ன?","கனவு"],["கையால் இழுத்தால் அசையும் நாக்கு, கணீரென்று அனைவரையும் அழைக்கும் – அது என்ன?","மணியோசை"],["பூட்டு இல்லாத பெட்டியை திறக்கலாம், ஆனால் மீண்டும் பூட்ட முடியாது – அது என்ன?","தேங்காய்"],["தேவை என்றால் வீசுவார்கள், தேவையில்லை என்றால் எடுத்து வைப்பார்கள் – அது என்ன?","நங்கூரம்"],["ஒட்டி பிறந்த சகோதரர்கள் சேர்ந்தால் மற்றவர்களை பிரிக்கவே சேருவார்கள் – அது என்ன?","கத்தரிக்கோல்"],["எட்டித் தொட நினைத்தேன், இடறி விழுந்தேன், குதித்து தொட நினைத்தேன் குட்டிக் கரணம் போட்டேன் – அது என்ன?","வானம்"],["பழகினால் மறக்காதவன், பயம் அறியாதவன் – அவன் யார்?","நாய்"],["காலையில் உறவாடி வருவான், மாலையில் பறந்தோடிப் போவான் – அவன் யார்?","சூரியன்"],["நித்திரையின் தூதுவன், நினையாமல் வருவான் – அவன் யார்?","கொட்டாவி"],["உடல் இல்லாதவன் ஊரெல்லாம் பவனி வருவான் – அவன் யார்?","காற்று"],["வெளியே வெள்ளி, உள்ளே தங்கம் – அது என்ன?","முட்டை"],["பகலில் எரியா விளக்கு, இரவில் அணையா விளக்கு – அது என்ன?","நிலா"],["தங்கை தீட்டிய ஓவியம் தரையில் தவழ்கிறது – அது என்ன?","கோலம்"],["அனைவரையும் ஆட்டிப் படைக்கும், ஆதவன் வந்தால் ஓடிப்போகும் – அது என்ன?","குளிர்"],["வாணலியில் விரியும் வட்ட வட்ட இலை – அது என்ன?","அப்பளம்"],["உச்சியின் ஊடே சிக்கல் தீர்ப்பான், சிக்கிக் கொண்டால் பல்லை இழப்பான் – அவன் யார்?","சீப்பு"],["கொடுக்கு இரண்டு இருந்தாலும், அவனுக்கு வாலில்தான் விஷம் – அவன் யார்?","தேள்"],["உறையில் உறங்குவான், உயிரைப் பறிப்பான் – அது என்ன?","வாள்"],["ஆயிரம்பேர் அணி வகுத்தாலும் ஒரு தூசி கிளம்பாது – அவர்கள் யார்?","எறும்புக்கூட்டம்"],["எரித்தால் சிவப்பு அணைந்தால் கறுப்பு – அது என்ன?","கரித்துண்டு"],["கரித்துண்டு நான், கடினத்திற்கு நான், காண்போரைக் கவருவேன் – நான் யார்?","வைரம்"],["இரண்டு பெண்கள், இரட்டைப் பிறவிகள் ஒருத்தி கீழே வந்தால் ஒருத்தி மேலே போவாள் – அவர்கள் யார்?","தராசுத் தட்டுகள்"],["அடித்தால் வலிக்கும் கடித்தால் இனிக்கும் – அது என்ன?","கரும்பு"],["பாறைமேல் இட்டவிதை பார்ப்பவர் வியக்க முளைத்த விதை – அந்த விதை?","பல்"],["மண்ணிலே பிறந்து விண்ணிலே மறையுது – அது என்ன?","நிலா"],["நீரிலே கொண்டாட்டம், நிலத்திலே திண்டாட்டம் – அது என்ன?","மீன்"],["நிலத்திலே முளைக்காத செடி, நிமிர்ந்து நிற்காத செடி – அது என்ன?","தலைமுடி"],["தொப்பை பயனுக்கு ஒரு வாசல் தோழனுக்கு இரண்டு வாசல் – அது என்ன?","சட்டை"],["தச்சர் கொத்தனார் செய்யாத தேர் தானே கிளம்பும் சித்திர தேர் – அது என்ன?","புற்று"],["சிவப்பு மொசைக் கொட்டை பகட்டும் பட்டு சட்டை அந்த சட்டை – அது என்ன?","பட்டுப்பூச்சி"],["உணவை எடுப்பான், எல்லோருக்கும் கொடுப்பான், ஆனால் தான் மட்டும் உண்ணமாட்டான் – அவன் யார்?","அகப்பை"],["உதைக்க தெரிந்தவனுக்கு நன்கு உழைக்கவும் தெரியும் – அவன் யார்?","கழுதை"],["உமிபோல் பூ பூக்கும் சிமிழ்போல் காய் காய்க்கும் – அது என்ன?","நெல்லிக்காய்"],["உணவு கொடுத்தால் வளருவான், நீர் கொடுத்தால் மாண்டு போவான் – அவன் யார்?","நெருப்பு"],["உறங்காமல் தவிப்பவன், ஊருக்குள் வந்தால் பலரை பலி வாங்குவான் – அவன் யார்?","சுனாமி"],["உயிரில்லாதவன் தினமும் ஓயாமல் ஓடுகிறான் – அவன் யார்?","கடிகாரம்"],["கடலில் பிறந்தவன், அவன் இல்லாத வீடே இல்லை – அவன் யார்?","உப்பு"],["மண்மீது குடையாவான், மழைக்கு துணையாவான் – அவன் யார்?","மரம்"],["ஊருக்கெல்லாம் ஒரே ஆடை – அது என்ன?","வானம்"],["கையுண்டு தலை இல்லை, உடல் உண்டு உயிர் இல்லை – அவன் யார்?","சட்டைத்துணி"],["அள்ள முடியும், கிள்ள முடியாது – அது எது?","தண்ணீர்"],["ஒற்றை முத்துக்கு ஒரு பெட்டி, இரட்டை முத்துக்கும் ஒரே பெட்டி – அது என்ன?","வேர்க்கடலை"],["மூன்று கொண்டை வைத்திருப்பாள் ஆனால் பெண் அல்ல – அது என்ன?","அடுப்பு விளிம்புகள்"],["ஊரையே சுற்றுவான் ஆனால் வீட்டிற்குள் வரமாட்டான் – அவன் யார்?","செருப்பு"],["பத்து திங்கள் இருட்டறையில் இருந்தவன், விடுதலையானதும் அழுகிறான் – அவன் யார்?","பிறக்கும் குழந்தை"],["தேவைப்படும்போது பையை நிரப்பலாம், ஆனால் தேவைக்கு மேலே பையை நிரப்ப முடியாது – அது என்ன?","வயிறு"],["இரவிலே எழும் தீபம், பகலில் பார்க்க முடியாது – அது என்ன?","நிலவு"],["உடைக்க முடியாத ஓட்டிற்குள் ஒளிந்திருப்பான் கள்ளன் – அவன் யார்?","ஆமை"],["ஒருநாள் முழுமுகம் காட்டுவான், ஒருநாள் முகமே காட்ட மாட்டான் – அவன் யார்?","நிலவு"],["வீடு கட்டத் தேவை சாரம். வீட்டு ஒளிக்குத் தேவை இன்னொரு சாரம் – அது என்ன சாரம்?","மின்சாரம்"],["உடல் முழுதும் நூறுகட்டு, உச்சி முடிக்கு கட்டே இல்லை – அது என்ன?","தென்னை மரம்"],["நீரில் மிதக்கும் பூ, இரவில் பூக்கும், பகலில் உறங்கும் – அது என்ன பூ?","அல்லிப்பூ"],["போதையின்றி தள்ளாடினாலும், புறப்படும் ஊர் போய் சேருவான் – அது என்ன?","கப்பல்"],["ஒரே நேரத்தில் மூடித் திறக்கும் கதவுகள், ஓராயிரம் முறை இயங்கினாலும் ஓசை வராத கதவுகள் – அது என்ன?","இமைகள்"],["குளிருக்கு கல்லாவான், அனலுக்கு தண்ணீராவான் – அது என்ன?","பனிக்கட்டி"],["கிட்ட இருக்கும் பட்டணம் எட்டி பார்க்க முடியாது – அது என்ன?","நமது முதுகு"],["பெட்டியை உடைத்தால் முத்துக்கள் – அது என்ன?","மாதுளம் பழம்"],["காற்றிலே பறந்து போகும் கண்ணாடிக் கூண்டு, கைபட்டால் உடைந்து போகும் கண்ணாடிக் கூண்டு – அது என்ன?","சோப்புக் குமிழ்"],["பள்ளிக்குப் போனாலும் பாடம் படிக்க மாட்டான், ஆனால் சரியாக கணக்குச் சொல்வான் – அவன் யார்?","கால்குலேட்டர்"],["குடையுடன் சந்தைக்கு வருபவரை, குழம்புக்காக எல்லோரும் விரும்புவார்கள் – அது என்ன?","கத்தரிக்காய்"],["மழை நேரத்தில் வெட்ட வெளியில் மின்னும் விளக்கு – அது என்ன?","மின்னல்"],["சரியென்றாலும் அழிப்பான், தவறென்றாலும் அழிப்பான் – அவன் யார்?","ரப்பர்"],["ஒலி கொடுத்து அழைப்பான், உரையாடலில் திளைப்பான் – அவன் யார்?","டெலிபோன்"],["ஆட்டிவிட்டால் ஆடுவான், ஆட்டாவிட்டால் தொங்குவான் – அவன் யார்?","ஊஞ்சல்"],["மண்ணெடுத்து கூடு கட்டும், மரம் அரித்து உயிர் வாழும் – அது என்ன?","கரையான்"],["சிதறிக் கிடக்குது புள்ளிகள் சித்திரம் வரைய ஆளில்லை – யார் அது?","நட்சத்திரக்கூட்டம்"],["விருந்துக்கு அழைத்து விதியை முடிப்பவன் – அவன் யார்?","எலிப்பொறி"],["குதி குதித்தான் பல் இளித்தான் – அவன் யார்?","சோளப்பொறி"],["அம்பும் நாணும் இல்லாத வில், ஆகாயத்தில் தோன்றும் வில் – அது என்ன வில்?","வானவில்"],["காற்றில் பறக்கும் ஆடையை, கழற்றி எறிந்தவன் புற்றுக்குள்ளே – அது என்ன?","பாம்பு"],["வானம் இருண்டால் வடிவழகி ஆடுவாள் – அவள் யார்?","மயில்"],["நன்றி மறக்காத பிள்ளை, நம்ம வீட்டு செல்லப் பிள்ளை – அது யார்?","நாய்"],["இரட்டைக் குழல் துப்பாக்கியில் காற்று வரும் போகும் – அது என்ன?","மூக்கு"],["வெட்கையிலே மலரும் பூ, வெகுபேர் பசி போக்கும் – அது என்ன?","சோறு"],["தாய் சின்னக்கொடி, பிள்ளைகள் பெரியவர்கள் – இது என்ன?","பூசணிக்காய்"],["சோறுபோல பொங்க வைத்து, சுவரெல்லாம் பூசுவார்கள் – அது என்ன?","சுண்ணாம்பு"],["பறக்கும் வண்ணப்பட்டு, வாடுமம்மா மற்றவர்கள் கைபட்டு – அது என்ன?","பட்டாம் பூச்சி"],["காற்றிலே பறக்குது கண்ணாடிக்கூண்டு, கையால் தொட்டால் காணாமல் போகுது – அது என்ன?","சோப்புக் குமிழ்"],["ஒன்றாய் பிறந்து ஒரே வேலையை செய்யும் இரட்டையர்கள் – அவர்கள் யார்?","கண் பார்வை"],["இரவல் கிடைக்காதது, இரவில் கிடைக்கும் – அது என்ன?","தூக்கம்"],["இரவிலே பிறந்த ராஜகுமாரனுக்கு தலையிலே குடை – அது என்ன?","காளான்"],["உச்சியில் தோகை, உள்ளங்காலில் ரோமம், உடலெல்லாம் வரிகள் – அது என்ன?","கரும்பு"],["மொட்டைப் பாறையில் மூடிய கண்கள் மூன்று – அது என்ன?","தேங்காய்"],["வெளிச்சத்தில் தொடருவான், இருட்டில் தொடரமாட்டான் – அவன் யார்?","நிழல்"],["அள்ளக் குறையாது, குடிக்க உதவாது – அது என்ன?","கடல் நீர்"],["அவன் கழற்றிய சட்டையை அடுத்தவன் போட முடியாது – அது என்ன?","பாம்பு"],["அந்தரத்து தொட்டிலில் ஆடுவார்கள், கூடுவார்கள் – அவர்கள் யார்?","தூக்கணாங் குருவிகள்"],["அண்ணன் சுட்டெரிப்பான், தம்பி குளிர வைப்பான் – அவர்கள் யார்?","சூரியன், சந்திரன்"],["அவ்வப்போது நிரப்பலாம், மொத்தமாக நிரப்ப முடியாது – அது என்ன?","வயிறு"],["அவன் அன்னநடை நடந்தாலும் பூமி அதிரும் – அவன் யார்?","யானை"],["அண்ணன் தம்பி அஞ்சு பேரு, அதில சின்னவன் இல்லாம பெரியவங்களால எதுவும் செய்ய முடியாது – யார் அவர்கள்?","நமது கை விரல்கள்"],["ஆனந்தத்திற்கும், துக்கத்திற்கும் மட்டுமே தண்ணீர் பொங்கும் குளம் – அது என்ன குளம்?","கண்கள் – கண்ணீர்"],["காலையும் மாலையும் உயர்ந்தவன், மதிய வேளையில் குட்டையாவான், இரவில் எங்கேதான் போவானோ – அவன் யார்?","நமது நிழல்"],["மூணு கண்ணுப் பானையிலே ஒரு மடக்குத் தண்ணீர் – அது என்ன?","தேங்காய்த் தண்ணீர்"],["கடலில் தோன்றி, கடலில் மறையும் – அது என்ன?","அலைகள்"],["ஆளில்லாத வீட்டில் அவன் குடியேறுவான் – அவன் யார்?","சிலந்திகள்"],["கால் இல்லாத பந்தலை, காணக்காண வினோதம் – அது என்ன?","வானம்"],["கையில் தவழும், பையில உறங்கும் – அது என்ன?","பணம்"],["குடிக்கத் தண்ணீர் உண்டு, குளிக்கத் தண்ணீர் இல்லை – அது என்ன?","இளநீர்"],["திறந்து திறந்து மூடினாலும், ஓசை சிறிதும் கேட்காது – அது என்ன?","இமைகள்"],["வெள்ளைச் சீமாட்டியின் தலை மேல் விளக்கு – அது என்ன?","மெழுகுவர்த்தி"],["கோணல் எத்தனை இருந்தாலும் குணமும், ருசியும் மாறாது – அது என்ன?","கரும்பு"],["உடலுக்குள் உருவாகும் உருவமில்லா கல், அதிர்ச்சியில் மறையும் கல் – அது என்ன கல்?","விக்கல்"],["கண் சிமிட்டி கண்டதையெல்லாம் பெட்டிக்குள் போட்டுக் கொள்வான் – அவன் யார்?","கேமரா"],["கல்லில் நீரூற்ற, கனன்று உருவாகும் பூ – அது என்ன பூ?","சுண்ணாம்பு"],["கமண்டலம் இல்லாமல் தவமிருப்பான், தூண்டில் இல்லாமல் மீன் பிடிப்பான் – அவன் யார்?","கொக்கு"],["சிறுதூசி விழுந்ததும், குளமே கலங்கியது – அது என்ன?","கண்கள்"],["அரைசாண் ராணிக்குள்ளே ஆயிரம் முத்துக்கள் – அது என்ன?","வெண்டைக்காய்"],["நிழலுக்கு ஒதுங்கலாம், மழைக்கு ஒதுங்க முடியாது – அது என்ன?","மரம்"],["பால் கொடுத்துப் பழகினாலும், என்றும் பகையாளியாக இருப்பான் – அவன் யார்?","பாம்பு"],["நாலு கால் இருந்தும் அவன் நடப்பதில்லை, இருக்கையிலே தான் அவன் வாழ்வு – அது யார்?","நாற்காலி"],["ஒற்றைக் காது உள்ளவனுக்கு ஒருபோதும் கேட்காது – அது என்ன?","ஊசி"],["வீடுகட்ட உதவாத கல், சமையலுக்கு உதவும் கல் – அது என்ன கல்?","உப்புக்கல்"],["தலைகீழாய் தொங்குவான், தலையசைத்தால் தென்றல் தருவான் – அவன் யார்?","மின் விசிறி"],["அன்பால் மலரும் பூ, அனைவரும் விரும்பும் பூ, மனிதன் உதட்டில் மலரும் பூ – அது என்ன பூ?","சிரிப்பு"],["கல்லாலும் மண்ணாலும் கட்டாத வீடு, கதவு இல்லாத வீடு காற்றினிலே ஆடும் வீடு – அது என்ன?","தூக்கணாங் குருவிக் கூடு"],["கடல் நீரால் வளர்வான், மழை நீரால் மடிவான் – அவன் யார்?","உப்பு"],["திரி இல்லாத விளக்கு, திரிலோகம் எல்லாம் தெரியுதாம் – அது என்ன?","சூரியன்"],["நான்கு காலில் பின்னிய வலையில் நாமெல்லாம் தூங்கலாம் – அது என்ன?","நார்க்கட்டில்"],["பறக்கும் ஆனால், பறந்து போகாது – அது என்ன?","கொடி"],["அரிசி மாவில் வரையாத அழகு கோலம், அங்கமெல்லாம் அழகாக்கும் – அது என்ன?","பச்சை குத்துதல்"],["குப்பை மேட்டில் குதறுவாள், கொஞ்சிப்பேணி பிள்ளை வளர்ப்பாள் – அவள் யார்?","கோழி"],["பச்சை, கருப்பு, வெள்ளை மூன்றும் பக்குவமானால் சிவப்பு – அது என்ன?","வெற்றிலை, பாக்கு, சுண்ணாம்பு"],["பசுமை பாய் விரித்த சோலை, பசிபோக்கும் சோலை – அது என்ன?","நெல் வயல்"],["அக்காள் வீட்டில் விளக்கு ஏற்றினால், தங்கை வீட்டிலும் தானே எரியும் – அது என்ன?","இணைந்த அடுப்பு"],["பகலில் அக்கினித் தட்டு, இரவில் குளிர்தட்டு – அது என்ன?","சூரியன், சந்திரன்"],["ஒளியில் நம்கூடவே இருப்பான், இருளில் மறைந்து கொள்வான் – அவன் யார்?","நிழல்"],["அவன் பற்களை அழுத்தினால் பல பேர் ரசிக்கும் இசை ஒலிக்கும் – அவன் யார்?","ஹார்மோனியப் பெட்டி"],["பகலில் இருபுறம் நின்று காவல் காப்பான், இரவில் நடுவிலே நின்று காவல் காப்பான் – அவன் யார்?","இரட்டை கதவு"],["பச்சைப் பெட்டியில் பத்துச்சரம் முத்துகள் – அது என்ன?","வெண்டைக்காய்"],["பட்ட மரம் இசை எழுப்ப படைகள் திரண்டு வரும் – அது என்ன?","முரசு"],["தாயோ கடல், தந்தையோ சூரியன் – அவன் யார்?","உப்பு"],["தங்கை விளக்கு காட்ட, அண்ணன் மத்தளம் கொட்ட, அம்மா தண்ணீர் தெளிக்கிறாள் – அவர்கள் யார்?","மின்னல், இடி, மழை"],["கூன் முதுகு கிழவனுக்கு குதிகால் வரை பற்கள் – அது என்ன?","கதிர் அரிவாள்"],["கத்தியால் வெள்ளையனைச் சீவ கருப்பன் தலைகாட்டுவான் – அவன் யார்?","பென்சில்"],["எட்டாத இடத்திலே ஏகப்பட்ட மின்மினிப் பூச்சிகள் – அவை என்ன?","நட்சத்திரம்"],["பகலில் தங்கத் தட்டு, இரவில் வெள்ளித் தட்டு – அது என்ன?","சூரியன், சந்திரன்"],["கை இல்லை, கால் இல்லை, காடு மேடு, மலை தாண்டி போகிறான், ஆனால் பறவையல்ல – அது யார்?","மேகம்"],["வெளியில் இருப்பவனைத் தொட்டால், உள்ளிருப்பவன் அலறுவான் – அவன் யார்?","அழைப்பு மணி"],["மண்ணுக்கடியில் விளையும் இரட்டை முத்துக்கள் – அது என்ன?","வேர்க்கடலை"],["மரம் உண்டு கிளையில்லை, காய் துவர்க்கும், கனி இனிக்கும் – அது என்ன?","வாழை"],["கடல் இருக்கும் தண்ணீர் இருக்காது, நாடு இருக்கும் வீடு இருக்காது – அது என்ன?","உலக வரைபடம்"],["மழைக்கும் இடம் உண்டு, மன்னர் படைக்கும் இடம் உண்டு – அது என்ன?","மரத்தடி"],["விஷம் கொண்டதை விரும்பியே தொழுவர் – அது என்ன?","பாம்பு"],["இரண்டு கால் ஜீவன்களுக்கு இருக்க உதவுவான் மூன்று காலன் – அது என்ன?","முக்காலி"],["ஒற்றைக் கண்ணன் பிரிந்தவர்களை ஓடி ஓடி இணைப்பான் – அவன் யார்?","ஊசி – நூல்"],["காண்பவரை ஏமாற்றும் நீர், தாகம் தீர்க்காத நீர் – அது என்ன?","கானல் நீர்"],["கையால் பறப்பார்கள், மூக்கால் தின்பார்கள் – அவர்கள் யார்?","பறவைகள்"],["நீல நிறக் கடலிலே வெள்ளைத் தோணி மிதக்குது – அது என்ன?","நிலவு"],["நீரிலே கொண்டாட்டம், நிலத்திலே திண்டாட்டம் – அது யாருக்கு?","மீனுக்கு"],["வெளுத்த ஆளுக்கு, கருப்பு தலைப்பாகை – அது என்ன?","தீக்குச்சி"],["பத்து பேர் சேர்ந்தால் பஞ்சம் போக்குவார்கள் – அவர்கள் யார்?","கைவிரல்கள்"],["ஒரு வீட்டுக்கு இரண்டு வாசல் – அது என்ன?","மூக்கு"],["இருட்டிற்கு அழைப்பார்கள், வெளிச்சம் வந்தால் அணைப்பார்கள் – அது என்ன?","விளக்கு"],["சின்னக் கதவுகள், லட்சம் முறை மூடித்திறந்தாலும் ஓசை வராத கதவுகள் – அது என்ன?","கண் இமைகள்"],["தாகம் தீர்க்கும் தண்ணீர் சொம்பு அந்தரத்தில் தொங்குது – அது என்ன?","இளநீர்"],["கல்லை சுமந்து, கறிக்கு ருசியாவான் – அவன் யார்?","புடலங்காய்"],["அடர்ந்த காட்டில் ஒத்தையடிப் பாதை – அது என்ன?","தலைவகிடு"],["நித்தம் வரும் விருந்தாளி மாலையில் மறைந்து போவான் – அவன் யார்?","சூரியன்"],["மரத்துக்கு மேலே பழம், பழத்துக்கு மேலே மரம் – அது என்ன?","அன்னாசிப் பழம்"],["பகலிலே வெறுங்காடு, இரவெல்லாம் பூக்காடு – அது என்ன?","வானம்"],["மேகத்தின் பிள்ளை, தாகத்தின் நண்பன் – அவன் யார்?","மழை"],["ராத்திரி பிறந்த பையன் தலையில் குல்லாவுடன் பிறந்தான் – அவன் யார்?","காளான்"],["குமுறி குமுறி அழுதிடும், நல்ல சோற்றை தந்திடும் – அது என்ன?","உலைநீர்"],["அரை சாண் அரசனுக்கு, அரை சாண் கிரீடம் – அவன் யார்?","கத்தரி"],["குண்டு ராஜாவுக்கு குடல் முழுக்க பல் – அது என்ன?","மாதுளை"],["காலத்துக்கும் எரிவேன், கடலைக்கூட வற்ற வைப்பேன் – நான் யார்?","சூரியன்"],["கொடி உடம்புக்காரிக்கு குண்டு குண்டாய் பிள்ளைகள் – அது என்ன?","பூசணிக்காய்"],["ஓட்டைக் குச்சியில் ஒய்யார ராகம் இசைக்கலாம் – அது என்ன?","புல்லாங்குழல்"],["மண்ணில் துளிர்த்து பூக்காமல், காய்க்காமல் மாலையாகும், மருந்தாகும் – அது என்ன?","புல்"],["ஆயிரம் கண்ணுடையவன் அகப்பட்டதை விடமாட்டான் – அது என்ன?","சல்லடை"],["அலங்கார ஆடை உருவாக அவர்கள் இருவர் துணை வேண்டும் – யார் அவர்கள்?","ஊசி – நூல்"],["ஆயிரம் அறை மண்டபத்திலே அத்தனையும் இனிப்பு – அது என்ன?","தேன் கூடு"],["வெள்ளை, கருப்பு கருவுடன் கூடிய முட்டை – அது என்ன?","கண்"],["ஊசி இலை கட்டுக்குள் ஊர்ந்து செல்லும் பன்றிகள் – அது என்ன?","பேன்கள்"],["கடலுக்குள் விளையும் முத்து அல்ல, நிலத்துக்குள் விளையும் முத்து – அது என்ன?","வேர்க்கடலை"],["எண்ணெய் குடித்துவிட்டு ஏழு கடல் தாண்டுவான் – அவன் யார்?","விமானம்"],["நிலத்தில் மின்னும் வைரம், நீரில் மூழ்கி கரையும் – அது என்ன?","உப்பு"],["தாகத்துக்கு அள்ளிக்குடிக்க முடியாத நீர், இறங்கி குளிக்க முடியாத நீர் – அது என்ன?","கானல் நீர்"],["அழகிய வட்டத்தட்டு, வாணலியில் போட்டால் கசங்கும் – அது என்ன?","அப்பளம்"],["கை இல்லாமல் நீந்துவான், கால் இல்லாமல் ஓடுவான் – அவன் யார்?","படகு"],["குளிர் இல்லாவிட்டாலும் குளிர் காய்வார் – அது யார்?","பொற்கொல்லர்"],["தட்டத் தட்ட தகடு, காயக் காய விறகு – அது என்ன?","எருக்கட்டி"],["ஆழக் கிடப்பவன் கைக்கு வந்தால் ஆயிரம் மதிப்பு – அது என்ன?","முத்து"],["வாய் திறக்காமல் தகவல் சொல்வான் – அவன் யார்?","தபால்"],["உலகே எதிர்பார்க்கும் அவன் வரவை – அவன் யார்?","மழை"],["எதையும் பேசும் எலும்பில்லாதவன் – அவன் யார்?","நாக்கு"],["பார்த்தது இருவர், பறித்தது இருவர், ஆனால் சுவைப்பது மட்டும் ஒருவன் – அவர்கள் யார்?","கண்கள், கைகள், வாய்"],["புகையும், நெருப்பும் இல்லாமல் எரியும் – அது எது?","நெஞ்சு எரிச்சல்"],["அந்தி வரும் நேரம், அவளும் வரும் நேரம் – அவள் யார்?","நிலா"],["வான் வழி வருவான், பாதாளம் வழியாய் போவான் – அவன் யார்?","மழை"],["கறுப்பன் வயதானால் வெளுத்துவிடுவான் – அவன் யார்?","தலைமுடி"],["நெருப்பில் வெந்தவனுக்கு நீண்ட ஆயுள் – அவன் யார்?","செங்கல்"],["அவனைக் கண்டால் அஞ்சுவார்கள், ஆதிசேஷனாய் வணங்குவார்கள் – அவன் யார்?","பாம்பு"],["சட்டையை கழற்றினால், சாப்பாடு தயார் – அது என்ன?","வாழைப்பழம்"],["பகலெல்லாம் அண்ணன் நம்முடன் இருப்பான். இரவில் தம்பி நம்முடன் வருவான் – அவர்கள் யார்?","சூரியன், சந்திரன்"],["இணை பிரியாமல் வருவார்கள் இரட்டையர்கள், அவர்கள் மோதினால் ஆள் காலி – அவர்கள் யார்?","இடி, மின்னல்"],["கொண்டையில் பூ உண்டு, கோழிக்கு உறவுக்காரன் – அவன் யார்?","சேவல்"],["இளசிலே தாகம் தீர்ப்பான், முற்றினால் சமையலில் ருசிப்பான் – அது என்ன?","தேங்காய்"],["குங்கும நிறத்தில் பூ பூக்கும், கொள்ளுக்காய் போல் காய்காய்க்கும் – அது என்ன?","கொளிஞ்சி செடி"],["இரண்டு பேர் சேர்ந்தால் எதையும் செய்து முடிப்பார்கள் – அவர்கள் யார்?","கைகள்"],["அரை சாண் ராணி, வயிற்றில் ஆயிரம் முத்துக்கள் சுமக்கிறாள் – அது என்ன?","வெண்டைக்காய்"],["உயிரில்லாதவனுக்கு உடம்பெல்லாம் நரம்பு – அது என்ன?","பாய்"],["அச்சு இல்லாத சக்கரம், அழகை கூட்டும் சக்கரம் – அது என்ன?","வளையல்"],["சுற்றி சுற்றி சூட்டைப் போக்கினாள் – அவன் யார்?","மின்விசிறி"],["என்னில் உன்னைக் காணலாம் – நான் யார்?","கண்ணாடி"],["முதலில் ஒலிப்பான், பிறகு உரைப்பான் – அவன் யார்?","தொலைபேசி"],["அடித்தால் விலகாது, அணைத்தால் நிற்காது – அது என்ன?","தண்ணீர்"],["ஐவர் வீட்டுக்கு பொதுவாய் ஒரு முற்றம் – அது என்ன?","உள்ளங்கை"],["வால் உள்ள பையன் காற்றில் பறக்கிறான் – அவன் யார்?","பட்டம்"],["எத்தனை தரம் சுற்றினாலும், அவனுக்கு தலை சுற்றாது – அவன் யார்?","மின் விசிறி"],["முச்சந்தியில் மூன்று விளக்கு, பார்த்து நடந்தால் பாதுகாப்பு – அது என்ன?","சாலை சிக்னல் விளக்கு"],["அழகான பெண்ணுக்கு அதிசயமான வியாதி, பாதி நாள் மெலிவாள், மீதி நாள் வளர்வாள் – அவள் யார்?","நிலவு"],["பச்சை நிற அழகிக்கு, உதட்டுச் சாயம் பூசாமலேயே சிவந்த வாய் – அவள் யார்?","கிளி"],["மணமில்லா பூ, மாதர்கள் சூடாத பூ, சமையலில் மணக்கும் பூ – அது என்ன பூ?","காலிபிளவர்"],["பழம் காயாகி பந்தியிலே விருந்தாகும் – அது என்ன?","எலுமிச்சை ஊறுகாய்"],["ஆவியில் குளிக்கும், அரும்பசியை தீர்க்கும் – அது என்ன?","இட்லி"],["நீரில் நீந்தும், நிலத்தில் தாவும் – அது என்ன?","தவளை"],["நிலத்தில் உணவு, ஆகாயத்தில் வாழ்வு – அது யாருக்கு?","பறவைகள்"],["விதையின்றி முளைக்கும், வேரின்றி கிளைக்கும் – அது என்ன?","கொம்பு"],["கருப்பையில் சில மாதம், வெளிப்பையில் சில வருடம் பிள்ளை சுமப்பான் – அவன் யார்?","கங்காரு"],["சில்லறை சேர்த்து வைத்த செந்நிற அழகி – அவள் யார்?","மிளகாய் வற்றல்"],["ஆறாத் துயரில் ஊற்றெடுக்கும் ஆறு – அது என்ன?","கண்ணீர்"],["பகலில் தூங்கி இரவில் விழிப்பான் – அவன் யார்?","விண்மீன்"],["கால் இல்லாத மான், வேர் இல்லாத புல்லைத் தின்னும் – அது என்ன?","மீன் மற்றும் பாசி"],["ஒற்றைக் கால் மனிதனுக்கு ஒன்பது கை – அது என்ன?","மரம்"],["கிளைகள் உண்டு, ஆனால் இலைகள் கிடையாது – அது என்ன?","மான் கொம்பு"],["சிறகடி async function credKey(role,name,pw){
 try{if(!(window.crypto&&crypto.subtle))return null;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ks|'+role+'|'+name.toLowerCase()+'|'+pw));
  return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}

const CERT_KEYS=['fullname','occupation','school','place'];
const certDate=t=>{const d=new Date(t||Date.now());return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};
function certAsk(p){
 return new Promise(res=>{
  const dg=document.createElement('dialog');
  const L=[['fullname','பெயர் / Name'],['occupation','பதவி / Designation'],['school','பள்ளி / School Name'],['place','ஊர் / Place']];
  dg.innerHTML=`<form method="dialog" style="min-width:min(92vw,360px)"><h3 style="margin:0 0 6px">சான்றிதழுக்கான விவரங்கள்</h3><p style="font-size:13px;margin:0 0 10px;opacity:.8">Sign up விவரங்கள் இந்தச் சாதனத்தில் கிடைக்கவில்லை. ஒருமுறை உள்ளிடவும்; அடுத்த முறை தானாக வரும்.</p>${L.map(([k,l])=>`<label style="display:block;font-weight:700;font-size:13px;margin-top:8px">${l}<input data-k="${k}" value="${esc(p[k]||'')}" style="display:block;width:100%;box-sizing:border-box;padding:8px;font:inherit;margin-top:3px"></label>`).join('')}<div class="msg" style="color:#b3261e;min-height:18px"></div><div class="acts" style="margin-top:6px"><button type="submit" class="btn" value="ok">சான்றிதழ் உருவாக்கு</button><button type="submit" class="btn dk" value="no">Cancel</button></div></form>`;
  document.body.appendChild(dg);
  const f=dg.querySelector('form');
  f.addEventListener('submit',e=>{
   const ok=e.submitter&&e.submitter.value==='ok';
   if(!ok){dg.close();dg.remove();res(null);return}
   const o={};dg.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value.trim());
   if(CERT_KEYS.some(k=>!o[k])){e.preventDefault();dg.querySelector('.msg').textContent='எல்லா விவரங்களையும் நிரப்பவும்.';return}
   dg.remove();res(o)});
  dg.addEventListener('cancel',()=>{dg.remove();res(null)});
  dg.showModal();
 });
}
async function certProfile(){
 const p={};
 const take=o=>{if(!o)return;CERT_KEYS.forEach(k=>{if(!p[k]&&o[k])p[k]=String(o[k]).trim()})};
 take(me);take(me.prof);
 if(CERT_KEYS.some(k=>!p[k])&&REMOTE&&me.pw){try{const r=await api('login',{role:me.role,name:me.name,pw:me.pw},20000);if(r&&r.ok)take(r.user)}catch(e){}}
 if(CERT_KEYS.some(k=>!p[k])){try{take(JSON.parse(store.get('ks_prof_'+me.name)||'{}'))}catch(e){}}
 let out=p;
 if(CERT_KEYS.some(k=>!p[k])){out=await certAsk(p);if(!out)return null;if(REMOTE&&me.pw)api('setprofile',Object.assign({role:me.role,name:me.name,pw:me.pw},out),20000).catch(()=>{})}
 store.set('ks_prof_'+me.name,JSON.stringify(out));
 return out;
}

   <div style="font-size:19px;line-height:1.8;margin:14px auto 0;max-width:840px;color:#eadfc4">தாங்கள் <b style="color:${GL}">கற்றல் சிறகுகள்</b> இணையதளத்தில் <span style="display:inline-block;background:${FOIL};color:#2b1a00;font-weight:800;border-radius:8px;padding:0 14px;line-height:1.5;font-size:17px">${esc(sec)}</span> பகுதியில்${ttl?` “<b style="color:#fff">${esc(ttl)}</b>” என்ற`:''} கல்விப் பங்களிப்பைச் செய்து, மாணவர்களின் கற்றலுக்கு உதவியமைக்காக மனமார்ந்த பாராட்டுகளுடன் இச்சான்றிதழ் வழங்கப்படுகிறது.</div>

function certMeta(p,it,k){
 const c=k.split('/'),i=c[0]==='video'?5:c[0]==='cvid'?2:c[0]==='tet'?1:-1;
 const sec=(i>=0&&c[i])||c[c.length-1]||'';
 const ctx=c.slice(1).map((x,j)=>(c[0]==='video'&&j===3&&isOneMed(c[3])&&x==='TAMIL MEDIUM')?MED_LBL:x).filter((x,j)=>j+1!==i).join(' › ');
 let ttl=String(it.t||it.n||'').trim();if(ttl.length>90)ttl=ttl.slice(0,88)+'…';
 let h=0;const s=k+'|'+(it.t||'')+'|'+it.by+'|'+(it.ad||'');for(let x=0;x<s.length;x++)h=(h*31+s.charCodeAt(x))>>>0;
 const no='KS-'+certDate(it.ad).split('-').reverse().join('')+'-'+h.toString(36).toUpperCase().padStart(6,'0').slice(0,6);
 return {sec,ctx,ttl,no,date:certDate(it.ad)};
}
function certBody(m,p,t){
 return `<div style="position:absolute;left:0;right:0;top:14px">
   <div style="width:144px;height:144px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px ${t.ring}"><img src="${CERT_RING}" alt="கற்றல் சிறகுகள்" width="144" height="144" style="display:block;width:144px;height:144px"></div>
   ${t.title}
   <div style="font-family:'Poppins',sans-serif;font-size:18px;font-style:italic;color:${t.sub};letter-spacing:1px">Certificate of Appreciation</div>
   ${t.div}
   <div style="font-size:17px;color:${t.sub}">இச்சான்றிதழ் பெருமையுடன் வழங்கப்படுவது</div>
   <div style="display:inline-block;max-width:820px;font-size:40px;font-weight:800;line-height:1.4;color:${t.name};padding:0 30px 2px;margin-top:4px;word-break:break-word;border-bottom:3px solid ${t.line}">${esc(p.fullname)}</div>
   <div style="font-size:20px;font-weight:700;margin-top:8px;color:${t.desig}">${esc(p.occupation)}</div>
   <div style="font-size:18px;color:${t.school}">${esc(p.school)}, ${esc(p.place)}</div>
   <div style="font-size:19px;line-height:1.8;margin:14px auto 0;max-width:840px;color:${t.text}">தாங்கள் <b style="color:${t.bold}">கற்றல் சிறகுகள்</b> இணையதளத்தில் <span style="display:inline-block;background:${t.pillBg};color:${t.pillFg};font-weight:800;border-radius:8px;padding:0 14px;line-height:1.5;font-size:17px">${esc(m.sec)}</span> பகுதியில்${m.ttl?` “<b style="color:${t.bold}">${esc(m.ttl)}</b>” என்ற`:''} கல்விப் பங்களிப்பைச் செய்து, மாணவர்களின் கற்றலுக்கு உதவியமைக்காக மனமார்ந்த பாராட்டுகளுடன் இச்சான்றிதழ் வழங்கப்படுகிறது.</div>

   <div><img src="${t.sig}" alt="" style="display:block;width:200px;height:auto;margin:0 auto 2px"><div style="border-top:2px solid ${t.line};padding-top:4px;min-width:230px;font-size:16px;font-weight:700;color:${t.text}">நிர்வாகி</div><div style="font-size:13px;color:${t.sub}">கற்றல் சிறகுகள்</div></div>
